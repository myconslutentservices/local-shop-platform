<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login | Local Shop Platform</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase Configuration -->
  <script src="../js/supabase.js"></script>

  <style>
    /* ==========================================
       RESET / BOX SIZING
       ========================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px 16px;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ==========================================
       MAIN CONTAINER
       ========================================== */

    .container {
      width: 100%;
      max-width: 430px;
      min-width: 0;

      margin: auto;
    }

    /* ==========================================
       BRAND
       ========================================== */

    .brand {
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 15px;

      border-radius: 16px;

      background: #2563eb;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      font-weight: bold;

      flex-shrink: 0;
    }

    .brand h1 {
      max-width: 100%;

      font-size: 25px;
      line-height: 1.25;

      margin-bottom: 7px;

      overflow-wrap: anywhere;
    }

    .brand p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    /* ==========================================
       LOGIN CARD
       ========================================== */

    .card {
      width: 100%;
      max-width: 430px;
      min-width: 0;

      background: #111827;

      border: 1px solid #263244;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      font-size: 22px;
      line-height: 1.3;

      margin-bottom: 7px;

      overflow-wrap: anywhere;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 25px;

      overflow-wrap: anywhere;
    }

    /* ==========================================
       FORM
       ========================================== */

    #loginForm {
      width: 100%;
      min-width: 0;
    }

    .field {
      width: 100%;
      min-width: 0;

      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;
      line-height: 1.4;

      color: #cbd5e1;
    }

    /* ==========================================
       INPUTS
       ========================================== */

    input {
      display: block;

      width: 100%;
      max-width: 100%;
      min-width: 0;

      height: 50px;
      min-height: 48px;

      border-radius: 10px;

      border: 1px solid #334155;

      background: #0f172a;

      color: #ffffff;

      padding: 0 14px;

      outline: none;

      font-family: inherit;
      font-size: 16px;
      line-height: 1.2;

      -webkit-appearance: none;
      appearance: none;
    }

    input::placeholder {
      color: #64748b;
      opacity: 1;
    }

    input:focus {
      border-color: #3b82f6;
    }

    /* ==========================================
       PASSWORD
       ========================================== */

    .password-wrapper {
      position: relative;

      width: 100%;
      min-width: 0;
    }

    .password-wrapper input {
      padding-right: 88px;
    }

    .show-btn {
      position: absolute;

      right: 6px;
      top: 50%;

      transform: translateY(-50%);

      min-width: 64px;
      min-height: 40px;

      padding: 8px 10px;

      border: none;

      background: transparent;

      color: #60a5fa;

      cursor: pointer;

      font-family: inherit;
      font-size: 14px;
      line-height: 1.2;

      border-radius: 8px;

      touch-action: manipulation;

      -webkit-tap-highlight-color: transparent;
    }

    .show-btn:hover {
      background: rgba(96, 165, 250, 0.08);
    }

    .show-btn:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 1px;
    }

    /* ==========================================
       LOGIN BUTTON
       ========================================== */

    .login-btn {
      display: block;

      width: 100%;
      max-width: 100%;

      min-height: 50px;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      padding: 0 16px;

      font-family: inherit;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 600;

      cursor: pointer;

      margin-top: 5px;

      touch-action: manipulation;

      -webkit-tap-highlight-color: transparent;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-btn:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ==========================================
       MESSAGE
       ========================================== */

    .message {
      display: none;

      width: 100%;
      max-width: 100%;

      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 14px;
      line-height: 1.5;

      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .message.success {
      display: block;

      background: rgba(22, 163, 74, 0.12);

      border: 1px solid #166534;

      color: #86efac;
    }

    .message.error {
      display: block;

      background: rgba(220, 38, 38, 0.12);

      border: 1px solid #991b1b;

      color: #fca5a5;
    }

    /* ==========================================
       LOADING
       ========================================== */

    .loading {
      display: none;

      width: 100%;

      text-align: center;

      margin-top: 12px;

      color: #94a3b8;

      font-size: 13px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    /* ==========================================
       FOOTER
       ========================================== */

    .footer {
      width: 100%;

      text-align: center;

      margin-top: 20px;

      color: #64748b;

      font-size: 12px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    /* ==========================================
       SMALL MOBILE
       320px - 359px
       ========================================== */

    @media (max-width: 359px) {
      body {
        padding: 18px 12px;
        align-items: flex-start;
      }

      .container {
        margin-top: 12px;
        margin-bottom: 12px;
      }

      .brand {
        margin-bottom: 18px;
      }

      .logo {
        width: 56px;
        height: 56px;

        margin-bottom: 12px;

        border-radius: 14px;

        font-size: 22px;
      }

      .brand h1 {
        font-size: 20px;
      }

      .brand p {
        font-size: 13px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 15px;
      }

      .card h2 {
        font-size: 20px;
      }

      .subtitle {
        margin-bottom: 22px;
      }

      .field {
        margin-bottom: 16px;
      }

      input {
        height: 48px;
        min-height: 48px;

        padding-left: 12px;
        padding-right: 12px;
      }

      .password-wrapper input {
        padding-right: 82px;
      }

      .show-btn {
        right: 4px;
        min-width: 62px;
        min-height: 40px;
        padding-left: 8px;
        padding-right: 8px;
      }

      .login-btn {
        min-height: 48px;
        height: 48px;
      }
    }

    /* ==========================================
       NORMAL MOBILE
       360px - 480px
       ========================================== */

    @media (min-width: 360px) and (max-width: 480px) {
      body {
        padding: 20px 14px;
        align-items: flex-start;
      }

      .container {
        margin-top: 10px;
        margin-bottom: 10px;
      }

      .card {
        padding: 22px 18px;
      }

      .brand h1 {
        font-size: 22px;
      }
    }

    /* ==========================================
       TABLET
       ========================================== */

    @media (min-width: 481px) and (max-width: 1024px) {
      body {
        padding: 32px 24px;
      }

      .container {
        max-width: 430px;
      }

      .card {
        max-width: 430px;
      }
    }

    /* ==========================================
       DESKTOP
       ========================================== */

    @media (min-width: 1025px) {
      body {
        padding: 40px 24px;
      }

      .container {
        max-width: 430px;
      }

      .card {
        max-width: 430px;
      }
    }

    /* ==========================================
       SHORT HEIGHT SCREENS
       ========================================== */

    @media (max-height: 700px) {
      body {
        align-items: flex-start;
      }

      .container {
        margin-top: 16px;
        margin-bottom: 16px;
      }

      .brand {
        margin-bottom: 16px;
      }

      .logo {
        width: 52px;
        height: 52px;

        margin-bottom: 10px;

        border-radius: 13px;

        font-size: 21px;
      }

      .brand h1 {
        font-size: 21px;
        margin-bottom: 4px;
      }

      .card {
        padding-top: 22px;
        padding-bottom: 22px;
      }

      .subtitle {
        margin-bottom: 20px;
      }

      .field {
        margin-bottom: 14px;
      }
    }

    /* ==========================================
       VERY SHORT MOBILE SCREENS
       ========================================== */

    @media (max-width: 480px) and (max-height: 620px) {
      body {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .container {
        margin-top: 0;
        margin-bottom: 0;
      }

      .brand {
        margin-bottom: 12px;
      }

      .card {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .footer {
        margin-top: 14px;
      }
    }

    /* ==========================================
       REDUCED MOTION
       ========================================== */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- BRAND -->
    <div class="brand">

      <div class="logo">
        LS
      </div>

      <h1>
        Local Shop Platform
      </h1>

      <p>
        Owner Management Panel
      </p>

    </div>


    <!-- LOGIN CARD -->
    <div class="card">

      <h2>
        Owner Login
      </h2>

      <p class="subtitle">
        Login to manage your shop
      </p>


      <form id="loginForm">

        <!-- EMAIL -->
        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="owner@example.com"
            autocomplete="email"
            inputmode="email"
            autocapitalize="none"
            spellcheck="false"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-btn"
              id="showPassword"
              aria-label="Show password"
            >
              Show
            </button>

          </div>

        </div>


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Login
        </button>


        <!-- LOADING -->
        <div
          class="loading"
          id="loading"
        >
          Checking account...
        </div>


        <!-- MESSAGE -->
        <div
          class="message"
          id="message"
        ></div>

      </form>

    </div>


    <div class="footer">
      © 2026 Local Shop Platform
    </div>

  </div>


  <script>

    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const showPassword =
      document.getElementById("showPassword");

    const message =
      document.getElementById("message");

    const loading =
      document.getElementById("loading");


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    showPassword.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          showPassword.textContent =
            "Hide";

          showPassword.setAttribute(
            "aria-label",
            "Hide password"
          );

        } else {

          passwordInput.type =
            "password";

          showPassword.textContent =
            "Show";

          showPassword.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    // ==========================================
    // SAVE OWNER SESSION INFO
    // ==========================================

    function saveOwnerInfo(
      owner,
      shop
    ) {

      sessionStorage.setItem(
        "owner_id",
        owner.id
      );

      sessionStorage.setItem(
        "owner_name",
        owner.full_name || ""
      );

      sessionStorage.setItem(
        "owner_shop_id",
        owner.shop_id
      );

      sessionStorage.setItem(
        "owner_shop_name",
        shop.name || ""
      );

      sessionStorage.setItem(
        "owner_shop_slug",
        shop.slug || ""
      );

    }


    // ==========================================
    // OWNER LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        clearMessage();

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "error"
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        loading.style.display =
          "block";


        try {

          // ======================================
          // 1. SUPABASE LOGIN
          // ======================================

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {

            throw new Error(
              error.message
            );

          }


          if (!data?.user) {

            throw new Error(
              "Login failed. User account not found."
            );

          }


          const userId =
            data.user.id;


          console.log(
            "OWNER AUTH USER:",
            userId
          );


          // ======================================
          // 2. GET OWNER PROFILE
          // ======================================

          const {
            data: owner,
            error: ownerError
          } =
            await supabaseClient
              .from("owners")
              .select(
                "id, shop_id, full_name, phone, role"
              )
              .eq(
                "id",
                userId
              )
              .single();


          if (ownerError) {

            console.error(
              "OWNER PROFILE ERROR:",
              ownerError
            );

            throw new Error(
              "Owner profile could not be loaded."
            );

          }


          if (!owner) {

            throw new Error(
              "Owner profile not found."
            );

          }


          console.log(
            "OWNER PROFILE:",
            owner
          );


          // ======================================
          // 3. ROLE CHECK
          // ======================================

          if (
            owner.role !== "owner"
          ) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "This account is not an owner account."
            );

          }


          // ======================================
          // 4. SHOP CHECK
          // ======================================

          if (!owner.shop_id) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "No shop is assigned to this owner."
            );

          }


          // ======================================
          // 5. GET SHOP
          // ======================================

          const {
            data: shop,
            error: shopError
          } =
            await supabaseClient
              .from("shops")
              .select(
                "id, name, slug, status"
              )
              .eq(
                "id",
                owner.shop_id
              )
              .single();


          if (shopError) {

            console.error(
              "SHOP ERROR:",
              shopError
            );

            throw new Error(
              "Shop information could not be loaded."
            );

          }


          if (!shop) {

            throw new Error(
              "Assigned shop was not found."
            );

          }


          console.log(
            "OWNER SHOP:",
            shop
          );


          // ======================================
          // 6. SHOP STATUS
          // ======================================

          if (
            shop.status === "suspended"
          ) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "This shop is currently suspended. Please contact support."
            );

          }


          // ======================================
          // 7. SAVE OWNER DATA
          // ======================================

          saveOwnerInfo(
            owner,
            shop
          );


          // ======================================
          // 8. SUCCESS
          // ======================================

          showMessage(
            "Login successful! Opening dashboard...",
            "success"
          );


          // ======================================
          // 9. GO TO DASHBOARD
          // ======================================

          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            700
          );

        }


        catch (error) {

          console.error(
            "OWNER LOGIN ERROR:",
            error
          );


          showMessage(
            error?.message ||
            "Login failed. Please try again.",
            "error"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login";

          loading.style.display =
            "none";

        }

      }
    );


    // ==========================================
    // CHECK EXISTING LOGIN
    // ==========================================

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.log(
            "SESSION ERROR:",
            error
          );

          return;

        }


        if (
          !data?.session?.user
        ) {

          return;

        }


        const userId =
          data.session.user.id;


        // ======================================
        // GET OWNER
        // ======================================

        const {
          data: owner
        } =
          await supabaseClient
            .from("owners")
            .select(
              "id, shop_id, full_name, role"
            )
            .eq(
              "id",
              userId
            )
            .maybeSingle();


        // ======================================
        // IF ALREADY LOGGED IN
        // ======================================

        if (
          owner &&
          owner.role === "owner" &&
          owner.shop_id
        ) {

          window.location.href =
            "dashboard.html";

        }

      }

      catch (error) {

        console.log(
          "SESSION CHECK ERROR:",
          error
        );

      }

    }


    // ==========================================
    // START SESSION CHECK
    // ==========================================

    checkExistingSession();

  </script>

</body>
</html>
