<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Owner Login | Local Shop Platform</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your Supabase Configuration -->
  <script src="../js/supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 64px;
      height: 64px;

      margin: 0 auto 15px;

      border-radius: 16px;

      background: #2563eb;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      font-weight: bold;
    }

    .brand h1 {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .brand p {
      color: #94a3b8;
      font-size: 14px;
    }

    .card {
      background: #111827;

      border: 1px solid #263244;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      color: #cbd5e1;
    }

    input {
      width: 100%;
      height: 48px;

      border-radius: 10px;

      border: 1px solid #334155;

      background: #0f172a;

      color: #ffffff;

      padding: 0 14px;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-btn {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #60a5fa;

      cursor: pointer;

      font-size: 13px;
    }

    .login-btn {
      width: 100%;
      height: 50px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      margin-top: 5px;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 18px;

      padding: 12px 14px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.success {
      display: block;

      background: rgba(22, 163, 74, 0.12);

      border: 1px solid #166534;

      color: #86efac;
    }

    .message.error {
      display: block;

      background: rgba(220, 38, 38, 0.12);

      border: 1px solid #991b1b;

      color: #fca5a5;
    }

    .loading {
      display: none;

      text-align: center;

      margin-top: 12px;

      color: #94a3b8;

      font-size: 13px;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #64748b;

      font-size: 12px;
    }

    @media (max-width: 480px) {

      .card {
        padding: 22px;
      }

      .brand h1 {
        font-size: 22px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <!-- BRAND -->
    <div class="brand">

      <div class="logo">
        LS
      </div>

      <h1>
        Local Shop Platform
      </h1>

      <p>
        Owner Management Panel
      </p>

    </div>


    <!-- LOGIN CARD -->
    <div class="card">

      <h2>
        Owner Login
      </h2>

      <p class="subtitle">
        Login to manage your shop
      </p>


      <form id="loginForm">

        <!-- EMAIL -->
        <div class="field">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            placeholder="owner@example.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="field">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-btn"
              id="showPassword"
            >
              Show
            </button>

          </div>

        </div>


        <!-- LOGIN BUTTON -->
        <button
          type="submit"
          class="login-btn"
          id="loginButton"
        >
          Login
        </button>


        <!-- LOADING -->
        <div
          class="loading"
          id="loading"
        >
          Checking account...
        </div>


        <!-- MESSAGE -->
        <div
          class="message"
          id="message"
        ></div>

      </form>

    </div>


    <div class="footer">
      © 2026 Local Shop Platform
    </div>

  </div>


  <script>

    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const showPassword =
      document.getElementById("showPassword");

    const message =
      document.getElementById("message");

    const loading =
      document.getElementById("loading");


    // ==========================================
    // SHOW / HIDE PASSWORD
    // ==========================================

    showPassword.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          showPassword.textContent =
            "Hide";

        } else {

          passwordInput.type =
            "password";

          showPassword.textContent =
            "Show";

        }

      }
    );


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(
      text,
      type
    ) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    // ==========================================
    // SAVE OWNER SESSION INFO
    // ==========================================

    function saveOwnerInfo(
      owner,
      shop
    ) {

      sessionStorage.setItem(
        "owner_id",
        owner.id
      );

      sessionStorage.setItem(
        "owner_name",
        owner.full_name || ""
      );

      sessionStorage.setItem(
        "owner_shop_id",
        owner.shop_id
      );

      sessionStorage.setItem(
        "owner_shop_name",
        shop.name || ""
      );

      sessionStorage.setItem(
        "owner_shop_slug",
        shop.slug || ""
      );

    }


    // ==========================================
    // OWNER LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        clearMessage();

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "error"
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        loading.style.display =
          "block";


        try {

          // ======================================
          // 1. SUPABASE LOGIN
          // ======================================

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          if (error) {

            throw new Error(
              error.message
            );

          }


          if (!data?.user) {

            throw new Error(
              "Login failed. User account not found."
            );

          }


          const userId =
            data.user.id;


          console.log(
            "OWNER AUTH USER:",
            userId
          );


          // ======================================
          // 2. GET OWNER PROFILE
          // ======================================

          const {
            data: owner,
            error: ownerError
          } =
            await supabaseClient
              .from("owners")
              .select(
                "id, shop_id, full_name, phone, role"
              )
              .eq(
                "id",
                userId
              )
              .single();


          if (ownerError) {

            console.error(
              "OWNER PROFILE ERROR:",
              ownerError
            );

            throw new Error(
              "Owner profile could not be loaded."
            );

          }


          if (!owner) {

            throw new Error(
              "Owner profile not found."
            );

          }


          console.log(
            "OWNER PROFILE:",
            owner
          );


          // ======================================
          // 3. ROLE CHECK
          // ======================================

          if (
            owner.role !== "owner"
          ) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "This account is not an owner account."
            );

          }


          // ======================================
          // 4. SHOP CHECK
          // ======================================

          if (!owner.shop_id) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "No shop is assigned to this owner."
            );

          }


          // ======================================
          // 5. GET SHOP
          // ======================================

          const {
            data: shop,
            error: shopError
          } =
            await supabaseClient
              .from("shops")
              .select(
                "id, name, slug, status"
              )
              .eq(
                "id",
                owner.shop_id
              )
              .single();


          if (shopError) {

            console.error(
              "SHOP ERROR:",
              shopError
            );

            throw new Error(
              "Shop information could not be loaded."
            );

          }


          if (!shop) {

            throw new Error(
              "Assigned shop was not found."
            );

          }


          console.log(
            "OWNER SHOP:",
            shop
          );


          // ======================================
          // 6. SHOP STATUS
          // ======================================

          if (
            shop.status === "suspended"
          ) {

            await supabaseClient.auth
              .signOut();

            throw new Error(
              "This shop is currently suspended. Please contact support."
            );

          }


          // ======================================
          // 7. SAVE OWNER DATA
          // ======================================

          saveOwnerInfo(
            owner,
            shop
          );


          // ======================================
          // 8. SUCCESS
          // ======================================

          showMessage(
            "Login successful! Opening dashboard...",
            "success"
          );


          // ======================================
          // 9. GO TO DASHBOARD
          // ======================================

          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            700
          );

        }


        catch (error) {

          console.error(
            "OWNER LOGIN ERROR:",
            error
          );


          showMessage(
            error?.message ||
            "Login failed. Please try again.",
            "error"
          );


          loginButton.disabled =
            false;

          loginButton.textContent =
            "Login";

          loading.style.display =
            "none";

        }

      }
    );


    // ==========================================
    // CHECK EXISTING LOGIN
    // ==========================================

    async function checkExistingSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.log(
            "SESSION ERROR:",
            error
          );

          return;

        }


        if (
          !data?.session?.user
        ) {

          return;

        }


        const userId =
          data.session.user.id;


        // ======================================
        // GET OWNER
        // ======================================

        const {
          data: owner
        } =
          await supabaseClient
            .from("owners")
            .select(
              "id, shop_id, full_name, role"
            )
            .eq(
              "id",
              userId
            )
            .maybeSingle();


        // ======================================
        // IF ALREADY LOGGED IN
        // ======================================

        if (
          owner &&
          owner.role === "owner" &&
          owner.shop_id
        ) {

          window.location.href =
            "dashboard.html";

        }

      }

      catch (error) {

        console.log(
          "SESSION CHECK ERROR:",
          error
        );

      }

    }


    // ==========================================
    // START SESSION CHECK
    // ==========================================

    checkExistingSession();

  </script>

</body>
</html>
