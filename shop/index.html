<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:Arial,sans-serif;
      background:#f6f7fb;
      color:#111827
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}

    .top{
      position:sticky;
      top:0;
      z-index:20;
      background:#fff;
      border-bottom:1px solid #e5e7eb;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px
    }

    .brand{
      font-size:20px;
      font-weight:800
    }

    .sub{
      font-size:12px;
      color:#6b7280;
      margin-top:3px
    }

    .cartBtn{
      border:0;
      background:#111827;
      color:#fff;
      border-radius:12px;
      padding:11px 15px;
      font-weight:700
    }

    .cartCount{
      display:inline-flex;
      min-width:22px;
      height:22px;
      border-radius:50%;
      align-items:center;
      justify-content:center;
      background:#fff;
      color:#111827;
      margin-left:6px;
      font-size:12px
    }

    .wrap{
      max-width:1180px;
      margin:auto;
      padding:22px 16px 60px
    }

    .hero{
      background:#111827;
      color:#fff;
      border-radius:18px;
      padding:28px 22px;
      margin-bottom:20px
    }

    .hero h1{
      font-size:30px;
      margin-bottom:7px
    }

    .hero p{
      color:#cbd5e1
    }

    .cats{
      display:flex;
      gap:9px;
      overflow:auto;
      padding:2px 0 16px
    }

    .cat{
      white-space:nowrap;
      border:1px solid #d1d5db;
      background:#fff;
      padding:9px 14px;
      border-radius:999px
    }

    .cat.active{
      background:#111827;
      color:#fff;
      border-color:#111827
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
      gap:16px
    }

    .product{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 3px 12px rgba(0,0,0,.04)
    }

    .pic{
      height:210px;
      background:#eef1f5;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden
    }

    .pic img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .noimg{
      color:#9ca3af
    }

    .body{
      padding:14px
    }

    .name{
      font-size:17px;
      font-weight:800
    }

    .desc{
      font-size:13px;
      color:#6b7280;
      line-height:1.45;
      margin:7px 0
    }

    .price{
      font-weight:800;
      font-size:18px;
      margin:9px 0
    }

    .stock{
      font-size:12px;
      color:#059669;
      margin-bottom:10px
    }

    .out{
      color:#dc2626
    }

    .add{
      width:100%;
      border:0;
      background:#111827;
      color:#fff;
      padding:11px;
      border-radius:10px;
      font-weight:700
    }

    .add:disabled{
      background:#9ca3af;
      cursor:not-allowed
    }

    .empty,
    .loading{
      padding:30px;
      text-align:center;
      color:#6b7280;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px
    }

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:50
    }

    .overlay.show{
      display:flex
    }

    .modal{
      width:min(620px,100%);
      max-height:92vh;
      overflow:auto;
      background:#fff;
      border-radius:20px 20px 0 0;
      padding:20px
    }

    .modal h2{
      font-size:21px;
      margin-bottom:15px
    }

    .close{
      float:right;
      border:0;
      background:#f1f5f9;
      border-radius:50%;
      width:34px;
      height:34px;
      font-size:20px
    }

    .detailTop{
      display:flex;
      gap:15px
    }

    .detailImg{
      width:120px;
      height:120px;
      border-radius:12px;
      overflow:hidden;
      background:#eef1f5;
      flex:none
    }

    .detailImg img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .detailInfo{
      flex:1
    }

    .sizeTitle{
      font-size:13px;
      font-weight:700;
      margin:16px 0 8px
    }

    .sizes{
      display:flex;
      flex-wrap:wrap;
      gap:8px
    }

    .size{
      border:1px solid #d1d5db;
      background:#fff;
      border-radius:9px;
      padding:8px 12px
    }

    .size.sel{
      background:#111827;
      color:#fff;
      border-color:#111827
    }

    .qty{
      display:flex;
      align-items:center;
      gap:12px;
      margin:15px 0
    }

    .qty button{
      width:34px;
      height:34px;
      border:1px solid #d1d5db;
      background:#fff;
      border-radius:9px
    }

    .qty button:disabled{
      opacity:.5;
      cursor:not-allowed
    }

    .qty strong{
      min-width:24px;
      text-align:center
    }

    .primary{
      width:100%;
      border:0;
      background:#111827;
      color:#fff;
      padding:13px;
      border-radius:11px;
      font-weight:800
    }

    .primary:disabled{
      background:#9ca3af;
      cursor:not-allowed
    }

    .cartRow{
      display:grid;
      grid-template-columns:58px 1fr auto;
      gap:12px;
      align-items:center;
      padding:12px 0;
      border-bottom:1px solid #e5e7eb
    }

    .thumb{
      width:58px;
      height:58px;
      border-radius:10px;
      background:#eef1f5;
      overflow:hidden
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover
    }

    .rowName{
      font-weight:700
    }

    .rowMeta{
      font-size:12px;
      color:#6b7280;
      margin-top:4px
    }

    .rowRight{
      text-align:right
    }

    .remove{
      border:0;
      background:none;
      color:#dc2626;
      font-size:12px;
      margin-top:6px
    }

    .cartTotal{
      display:flex;
      justify-content:space-between;
      font-size:18px;
      font-weight:800;
      padding:16px 0
    }

    .formGrid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px
    }

    .field{
      margin-bottom:12px
    }

    .field.full{
      grid-column:1/-1
    }

    .field label{
      display:block;
      font-size:13px;
      font-weight:700;
      margin-bottom:6px
    }

    .field input,
    .field textarea{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:10px;
      padding:11px;
      background:#fff;
      outline:none
    }

    .field textarea{
      min-height:80px;
      resize:vertical
    }

    .field input:focus,
    .field textarea:focus{
      border-color:#111827
    }

    .saved{
      font-size:12px;
      color:#059669;
      margin:-4px 0 12px
    }

    .success{
      text-align:center;
      padding:25px 10px
    }

    .successIcon{
      font-size:48px;
      margin-bottom:8px
    }

    .success h2{
      margin-bottom:8px
    }

    .success p{
      color:#6b7280;
      line-height:1.5
    }

    .back{
      margin-top:18px;
      border:0;
      background:#111827;
      color:#fff;
      padding:11px 18px;
      border-radius:10px
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:20px;
      transform:translateX(-50%);
      background:#111827;
      color:#fff;
      padding:11px 16px;
      border-radius:10px;
      display:none;
      z-index:100;
      font-size:14px
    }

    .toast.show{
      display:block
    }


    .businessSection{margin:26px 0}.sectionTitle{font-size:23px;margin:0 0 14px}
    .serviceCard{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:9px}
    .serviceCard h3{font-size:18px}.serviceCard p{font-size:14px;color:#6b7280;line-height:1.5}
    .serviceMeta{font-weight:800;font-size:17px}.businessForm{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px;margin-top:18px}
    .businessForm h2{margin-bottom:8px}.businessForm .hint{color:#6b7280;font-size:13px;margin-bottom:15px;line-height:1.5}
    .formStatus{margin-top:10px;font-size:14px;line-height:1.5}.formStatus.error{color:#b91c1c}.formStatus.ok{color:#047857}
    .customFields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.customFields .field{min-width:0}
    .serviceActions{display:flex;gap:9px;margin-top:auto}.serviceActions button{flex:1}
    @media(max-width:600px){.sectionTitle{font-size:20px}.businessForm{padding:15px}.customFields{grid-template-columns:1fr}.serviceCard{padding:14px}}

    @media(max-width:600px){

      .hero h1{
        font-size:24px
      }

      .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px
      }

      .pic{
        height:165px
      }

      .body{
        padding:11px
      }

      .name{
        font-size:15px
      }

      .price{
        font-size:16px
      }

      .formGrid{
        grid-template-columns:1fr
      }

      .field.full{
        grid-column:auto
      }

      .detailTop{
        align-items:flex-start
      }

      .detailImg{
        width:95px;
        height:95px
      }
    }
  </style>
</head>

<body>

<header class="top">
  <div>
    <div class="brand" id="shopName">Loading shop...</div>
    <div class="sub" id="shopSub">Online Store</div>
  </div>

  <button class="cartBtn" type="button" onclick="openCart()">
    Card <span class="cartCount" id="cartCount">0</span>
  </button>
</header>


<main class="wrap">

  <section class="hero">
    <h1 id="heroName">Shop</h1>

    <p id="heroDesc">
      Browse products and add them to your card.
    </p>
  </section>


  <div id="message" class="loading">
    Loading products...
  </div>


  <div id="categoryBar" class="cats" style="display:none"></div>


  <section id="productsGrid" class="grid"></section>

  <section id="servicesPublicSection" class="businessSection" style="display:none">
    <h2 class="sectionTitle" id="servicesHeading">Services & offerings</h2>
    <div id="servicesPublicGrid" class="grid"></div>
  </section>
  <section id="enquirySection" class="businessForm" style="display:none">
    <h2 id="enquiryHeading">Contact this business</h2>
    <p class="hint" id="enquiryHint">Send a message and the business will get back to you.</p>
    <form id="publicEnquiryForm">
      <div class="formGrid">
        <div class="field"><label for="enquiryName">Your name *</label><input id="enquiryName" name="customer_name" required maxlength="120" autocomplete="name"></div>
        <div class="field"><label for="enquiryPhone">Phone</label><input id="enquiryPhone" name="customer_phone" maxlength="30" autocomplete="tel"></div>
        <div class="field"><label for="enquiryEmail">Email</label><input id="enquiryEmail" name="customer_email" type="email" maxlength="180" autocomplete="email"></div>
        <div class="field"><label for="enquiryType">Request type</label><select id="enquiryType" name="enquiry_type"><option value="general">General enquiry</option><option value="quote">Get a quote</option><option value="service_request">Service request</option><option value="product">Product enquiry</option><option value="delivery">Delivery</option><option value="pickup">Pickup</option><option value="other">Other</option></select></div>
        <div class="field full"><label for="enquiryMessage">How can we help? *</label><textarea id="enquiryMessage" name="message" required maxlength="4000"></textarea></div>
      </div>
      <div id="enquiryCustomFields" class="customFields"></div>
      <button class="primary" id="submitEnquiryBtn" type="submit">Send enquiry</button>
      <p id="enquiryStatus" class="formStatus" role="status" aria-live="polite"></p>
    </form>
  </section>

</main>


<!-- PRODUCT DETAILS -->

<div class="overlay" id="productOverlay">

  <div class="modal">

    <button
      class="close"
      type="button"
      onclick="closeProduct()">×</button>

    <h2>Product Details</h2>

    <div id="productDetail"></div>

  </div>

</div>


<!-- CARD -->

<div class="overlay" id="cartOverlay">

  <div class="modal">

    <button
      class="close"
      type="button"
      onclick="closeCart()">×</button>

    <h2>Your Card</h2>

    <div id="cartBox"></div>

  </div>

</div>


<!-- CHECKOUT -->

<div class="overlay" id="checkoutOverlay">

  <div class="modal">

    <button
      class="close"
      type="button"
      onclick="closeCheckout()">×</button>

    <h2>Checkout</h2>

    <div id="checkoutBox"></div>

  </div>

</div>



<div class="overlay" id="serviceBookingModal">
  <div class="modal">
    <button class="close" type="button" onclick="closeServiceBooking()" aria-label="Close">×</button>
    <h2 id="bookingTitle">Request a booking</h2><p id="bookingServiceMeta" class="hint"></p>
    <form id="publicBookingForm">
      <div class="formGrid">
        <div class="field"><label for="bookingName">Your name *</label><input id="bookingName" name="customer_name" required maxlength="120" autocomplete="name"></div>
        <div class="field"><label for="bookingPhone">Phone *</label><input id="bookingPhone" name="customer_phone" required maxlength="30" autocomplete="tel"></div>
        <div class="field"><label for="bookingEmail">Email</label><input id="bookingEmail" name="customer_email" type="email" maxlength="180" autocomplete="email"></div>
        <div class="field"><label for="bookingDate">Preferred date *</label><input id="bookingDate" name="booking_date" type="date" required></div>
        <div class="field"><label for="bookingTime">Preferred time</label><input id="bookingTime" name="start_time" type="time"></div>
        <div class="field"><label for="bookingPartySize">People / quantity</label><input id="bookingPartySize" name="party_size" type="number" min="1" max="100" value="1"></div>
        <div class="field full"><label for="bookingNotes">Notes</label><textarea id="bookingNotes" name="notes" maxlength="3000"></textarea></div>
      </div>
      <div id="bookingCustomFields" class="customFields"></div>
      <button class="primary" id="submitBookingBtn" type="submit">Request booking</button>
      <p id="bookingStatus" class="formStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>


<script>

let shop = null;

let products = [];
let services = [];
let categoryDefinition = null;
let selectedService = null;

let categories = [];

let activeCategory = 'all';

let selectedProduct = null;

let selectedSize = null;

let selectedQty = 1;

let card = [];


const slug =
  new URLSearchParams(location.search).get('shop')
  || 'kailash-test-shop';


const CARD_KEY =
  'shop_card_' + slug;


const CUSTOMER_KEY =
  'shop_customer_' + slug;


const money = v =>
  '₹' +
  Number(v || 0)
    .toLocaleString('en-IN');


const esc = s =>
  String(s ?? '').replace(/[&<>'"]/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    "'":'&#39;',
    '"':'&quot;'
  }[c]));


function toast(msg){

  const x =
    document.getElementById('toast');

  x.textContent = msg;

  x.classList.add('show');

  clearTimeout(window._toast);

  window._toast =
    setTimeout(
      () => x.classList.remove('show'),
      2200
    );
}


function getSavedCustomer(){

  try{

    return JSON.parse(
      localStorage.getItem(CUSTOMER_KEY)
      || 'null'
    ) || {};

  }catch{

    return {};

  }
}


function saveCard(){

  localStorage.setItem(
    CARD_KEY,
    JSON.stringify(card)
  );

  updateCardCount();
}


function loadCard(){

  try{

    card =
      JSON.parse(
        localStorage.getItem(CARD_KEY)
        || '[]'
      ) || [];

  }catch{

    card = [];

  }

  updateCardCount();
}


function updateCardCount(){

  document.getElementById(
    'cartCount'
  ).textContent =
    card.reduce(
      (n,x) =>
        n +
        Number(x.quantity || 0),
      0
    );
}


function totalCard(){

  return card.reduce(
    (n,x) =>
      n +
      Number(x.price || 0) *
      Number(x.quantity || 0),
    0
  );
}


/* =========================
   LOAD SHOP
========================= */

async function init(){

  loadCard();


  const {
    data:s,
    error:se
  } =
    await supabaseClient
      .from('shops')
      .select(
        'id,name,slug,logo_url,phone,whatsapp,address,description,status,category,business_details'
      )
      .eq('slug',slug)
      .single();


  if(se || !s){

    console.error(
      'SHOP ERROR',
      se
    );

    showMessage(
      'Shop not found.'
    );

    return;
  }


  if(s.status !== 'active'){

    showMessage(
      'This shop is currently unavailable.'
    );

    return;
  }


  shop = s;


  document.title =
    s.name || 'Shop';


  document.getElementById(
    'shopName'
  ).textContent =
    s.name || 'Shop';


  document.getElementById(
    'heroName'
  ).textContent =
    s.name || 'Shop';


  document.getElementById(
    'shopSub'
  ).textContent =
    s.address || 'Online Store';


  document.getElementById(
    'heroDesc'
  ).textContent =
    s.description ||
    'Browse products and add them to your card.';


  const definitionResult = s.category
    ? await supabaseClient.from('business_category_definitions')
        .select('name,slug,listing_type,default_action,field_schema,is_active')
        .eq('name', s.category).eq('is_active', true).maybeSingle()
    : {data:null,error:null};
  categoryDefinition = definitionResult.data || null;
  const listingType = String(categoryDefinition?.listing_type || 'product_service').toLowerCase();
  const showProducts = ['product','product_service','menu','listing'].includes(listingType);
  const showServices = ['service','product_service','room','menu','listing'].includes(listingType);
  document.getElementById('productsGrid').style.display = showProducts ? 'grid' : 'none';
  document.getElementById('categoryBar').style.display = showProducts ? 'flex' : 'none';
  document.getElementById('servicesPublicSection').style.display = showServices ? 'block' : 'none';
  document.getElementById('enquirySection').style.display = 'block';
  document.getElementById('servicesHeading').textContent = listingType === 'room' ? 'Rooms & stays' : (listingType === 'menu' ? 'Menu & offerings' : 'Services & offerings');
  document.getElementById('enquiryHeading').textContent = categoryDefinition?.default_action === 'quote' ? 'Request a quote' : 'Contact ' + (s.name || 'this business');
  const bookingActions = ['booking','appointment','reservation','room_booking'];
  renderCustomFields('enquiryCustomFields', bookingActions.includes(String(categoryDefinition?.default_action || '').toLowerCase()) ? [] : (categoryDefinition?.field_schema || []));

  const [cr,pr,sr] =
    await Promise.all([

      supabaseClient
        .from('categories')
        .select(
          'id,name,is_active'
        )
        .eq(
          'shop_id',
          s.id
        )
        .eq(
          'is_active',
          true
        )
        .order('name'),


      supabaseClient
        .from('products')
        .select(
          'id,shop_id,category_id,name,description,price,image_url,has_sizes,sizes,stock,is_active'
        )
        .eq(
          'shop_id',
          s.id
        )
        .eq(
          'is_active',
          true
        )
        .order(
          'created_at',
          {ascending:false}
        ),

      showServices
        ? supabaseClient.from('services')
            .select('id,shop_id,name,description,price,duration_minutes,image_urls,attributes,is_active')
            .eq('shop_id', s.id).eq('is_active', true).order('name')
        : Promise.resolve({data:[],error:null})

    ]);


  if(cr.error){

    console.error(
      'CATEGORY ERROR',
      cr.error
    );

  }else{

    categories =
      cr.data || [];

  }


  if(pr.error){

    console.error(
      'PRODUCT ERROR',
      pr.error
    );

    showMessage(
      'Products could not be loaded: ' +
      pr.error.message
    );

    return;
  }


  products =
    pr.data || [];


  document.getElementById(
    'message'
  ).style.display =
    'none';


  renderCategories();
  if (showProducts) renderProducts();
  else document.getElementById('productsGrid').innerHTML = '';
  if (sr.error) {
    console.error('SERVICES LOAD ERROR', sr.error);
    document.getElementById('servicesPublicGrid').innerHTML = '<div class="empty">Services are temporarily unavailable.</div>';
  } else {
    services = sr.data || [];
    renderServices();
  }
  if (!showProducts && !services.length) {
    document.getElementById('message').style.display = 'block';
    showMessage('This business has not published any listings yet. You can still send an enquiry below.');
  }
}


/* =========================
   MESSAGE
========================= */

function showMessage(m){

  const x =
    document.getElementById(
      'message'
    );

  x.className = 'empty';

  x.textContent = m;
}


/* =========================
   CATEGORIES
========================= */

function renderCategories(){

  const bar =
    document.getElementById(
      'categoryBar'
    );


  if(!categories.length){

    bar.style.display =
      'none';

    return;
  }


  bar.style.display =
    'flex';


  bar.innerHTML =
    '<button class="cat active" id="cat-all" onclick="filterCategory(\'all\')">All</button>' +

    categories
      .map(c =>

        `<button
          class="cat"
          id="cat-${esc(c.id)}"
          onclick="filterCategory('${esc(c.id)}')">
          ${esc(c.name)}
        </button>`

      )
      .join('');

}


function filterCategory(id){

  activeCategory =
    id;


  document
    .querySelectorAll('.cat')
    .forEach(
      x =>
        x.classList.remove(
          'active'
        )
    );


  const el =
    document.getElementById(
      'cat-' + id
    );


  if(el){

    el.classList.add(
      'active'
    );

  }


  if (document.getElementById('productsGrid').style.display !== 'none') renderProducts();

}


/* =========================
   SERVICES / ENQUIRIES
========================= */
function renderCustomFields(containerId, schema) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (!Array.isArray(schema)) { container.innerHTML = ''; return; }
  container.innerHTML = schema.map((field, index) => {
    if (!field || typeof field !== 'object') return '';
    const key = String(field.name || field.key || ('field_' + index)).replace(/[^a-zA-Z0-9_-]/g, '');
    if (!key) return '';
    const label = esc(field.label || field.name || key);
    const type = ['text','number','date','email','tel','url'].includes(field.type) ? field.type : 'text';
    const required = field.required === true ? 'required' : '';
    const options = Array.isArray(field.options) ? field.options : [];
    const input = field.type === 'textarea'
      ? '<textarea name="custom_' + esc(key) + '" ' + required + ' maxlength="1500"></textarea>'
      : (field.type === 'select' && options.length
        ? '<select name="custom_' + esc(key) + '" ' + required + '><option value="">Select…</option>' + options.map(o => '<option value="' + esc(typeof o === 'object' ? o.value : o) + '">' + esc(typeof o === 'object' ? (o.label || o.value) : o) + '</option>').join('') + '</select>'
        : '<input name="custom_' + esc(key) + '" type="' + type + '" ' + required + ' maxlength="250">');
    return '<div class="field"><label>' + label + (required ? ' *' : '') + '</label>' + input + '</div>';
  }).join('');
}
function getCustomFieldValues(containerId) {
  const root = document.getElementById(containerId), values = {};
  if (!root) return values;
  root.querySelectorAll('[name^="custom_"]').forEach(input => { if (input.value !== '') values[input.name.slice(7)] = input.value; });
  return values;
}
function renderServices() {

function openServiceAction(id) {

function openProduct(id){

  selectedProduct =
    products.find(
      p => p.id === id
    );


  if(!selectedProduct)
    return;


  const currentStock =
    Number(
      selectedProduct.stock || 0
    );


  if(currentStock <= 0){

    toast(
      'This product is out of stock'
    );

    renderProducts();

    return;
  }


  selectedSize = null;

  selectedQty = 1;


  const sizes =
    Array.isArray(
      selectedProduct.sizes
    )
    ? selectedProduct.sizes
    : [];


  const img =
    selectedProduct.image_url

    ? `<img
        src="${esc(selectedProduct.image_url)}"
        alt="${esc(selectedProduct.name)}">`

    : '<span class="noimg">No image</span>';


  document.getElementById(
    'productDetail'
  ).innerHTML = `

    <div class="detailTop">

      <div class="detailImg">
        ${img}
      </div>

      <div class="detailInfo">

        <h3>
          ${esc(selectedProduct.name)}
        </h3>

        <div class="price">
          ${money(selectedProduct.price)}
        </div>

        <div class="stock">
          In Stock · ${currentStock} available
        </div>

        <div class="desc">
          ${esc(
            selectedProduct.description || ''
          )}
        </div>

      </div>

    </div>


    ${
      selectedProduct.has_sizes &&
      sizes.length

      ? `

        <div class="sizeTitle">
          Select Size
        </div>

        <div class="sizes">

          ${sizes.map(s =>

            `<button
              type="button"
              class="size"
              onclick="chooseSize('${esc(s)}',this)">
              ${esc(s)}
            </button>`

          ).join('')}

        </div>

      `

      : ''
    }


    <div class="qty">

      <span>Quantity</span>

      <button
        type="button"
        onclick="changeQty(-1)">
        −
      </button>

      <strong id="detailQty">
        1
      </strong>

      <button
        type="button"
        onclick="changeQty(1)"
        ${currentStock <= 1 ? 'disabled' : ''}>
        +
      </button>

    </div>


    <button
      type="button"
      class="primary"
      onclick="addSelectedToCard()">

      Add to Card

    </button>

  `;


  document
    .getElementById(
      'productOverlay'
    )
    .classList.add('show');

}


function closeProduct(){

  document
    .getElementById(
      'productOverlay'
    )
    .classList.remove('show');

}


function chooseSize(s,el){

  selectedSize =
    s;


  document
    .querySelectorAll('.size')
    .forEach(
      x =>
        x.classList.remove(
          'sel'
        )
    );


  el.classList.add(
    'sel'
  );

}


function changeQty(n){

  if(!selectedProduct)
    return;


  const stock =
    Number(
      selectedProduct.stock || 0
    );


  selectedQty =
    Math.max(
      1,

      Math.min(
        stock,
        selectedQty + n
      )
    );


  const qtyEl =
    document.getElementById(
      'detailQty'
    );


  if(qtyEl){

    qtyEl.textContent =
      selectedQty;

  }


  const buttons =
    document
      .querySelectorAll(
        '.qty button'
      );


  if(buttons.length >= 2){

    buttons[1].disabled =
      selectedQty >= stock;

  }

}


/* =========================
   ADD TO CARD
========================= */

function addSelectedToCard(){

  if(!selectedProduct)
    return;


  const stock =
    Number(
      selectedProduct.stock || 0
    );


  if(stock <= 0){

    toast(
      'This product is out of stock'
    );

    closeProduct();

    renderProducts();

    return;
  }


  const sizes =
    Array.isArray(
      selectedProduct.sizes
    )
    ? selectedProduct.sizes
    : [];


  if(
    selectedProduct.has_sizes &&
    sizes.length &&
    !selectedSize
  ){

    toast(
      'Please select a size'
    );

    return;
  }


  const key =
    selectedProduct.id +
    '|' +
    (selectedSize || '');


  const existing =
    card.find(
      x =>
        x.key === key
    );


  const existingQty =
    existing
      ? Number(existing.quantity || 0)
      : 0;


  if(
    existingQty +
    selectedQty >
    stock
  ){

    toast(
      `Only ${stock} available`
    );

    return;
  }


  if(existing){

    existing.quantity =
      existingQty +
      selectedQty;

  }else{

    card.push({

      key,

      product_id:
        selectedProduct.id,

      name:
        selectedProduct.name,

      price:
        Number(
          selectedProduct.price ||
          0
        ),

      image_url:
        selectedProduct.image_url ||
        '',

      size:
        selectedSize ||
        null,

      variant:
        null,

      quantity:
        selectedQty

    });

  }


  saveCard();

  closeProduct();

  toast(
    'Product added to Card'
  );

}

}


function cardQty(i,n){

  const x =
    card[i];


  if(!x)
    return;


  const p =
    products.find(
      p =>
        p.id ===
        x.product_id
    );


  if(!p){

    toast(
      'Product is no longer available'
    );

    return;
  }


  const stock =
    Number(
      p.stock || 0
    );


  const newQty =
    x.quantity + n;


  if(newQty <= 0){

    card.splice(
      i,
      1
    );

  }else{

    if(newQty > stock){

      toast(
        `Only ${stock} available`
      );

      return;
    }


    x.quantity =
      newQty;

  }


  saveCard();

  renderCart();

}

async function refreshProducts(){

  if(!shop)
    return;


  const {data,error} =
    await supabaseClient
      .from('products')
      .select(
        'id,shop_id,category_id,name,description,price,image_url,has_sizes,sizes,stock,is_active'
      )
      .eq(
        'shop_id',
        shop.id
      )
      .eq(
        'is_active',
        true
      )
      .order(
        'created_at',
        {ascending:false}
      );


  if(error){

    console.error(
      'REFRESH PRODUCT ERROR',
      error
    );

    return;
  }


  products =
    data || [];


  renderProducts();

}


/* =========================
   PLACE ORDER
========================= */

async function placeOrder(e){

  e.preventDefault();


  if(
    !shop ||
    !card.length
  ){

    return;
  }


  const btn =
    document.getElementById(
      'placeBtn'
    );


  btn.disabled = true;

  btn.textContent =
    'Checking Stock...';


  const customer = {

    name:
      document
        .getElementById('cName')
        .value
        .trim(),

    phone:
      document
        .getElementById('cPhone')
        .value
        .trim(),

    address:
      document
        .getElementById('cAddress')
        .value
        .trim(),

    landmark:
      document
        .getElementById('cLandmark')
        .value
        .trim(),

    pincode:
      document
        .getElementById('cPincode')
        .value
        .trim()

  };


  /* PINCODE VALIDATION */

  if(
    !/^\d{6}$/.test(
      customer.pincode
    )
  ){

    toast(
      'Enter a valid 6 digit pincode'
    );

    btn.disabled = false;

    btn.textContent =
      'Place Order';

    return;
  }


  /* SAVE CUSTOMER DETAILS */

  localStorage.setItem(
    CUSTOMER_KEY,
    JSON.stringify(customer)
  );


  const total =
    totalCard();


  /* =========================
     PREPARE ORDER ITEMS
  ========================= */

  const items =
    card.map(x => ({

      product_id:
        x.product_id,

      product_name:
        x.name,

      price:
        Number(x.price || 0),

      quantity:
        Number(x.quantity || 0),

      size:
        x.size ||
        null,

      variant:
        x.variant ||
        null

    }));


  if(!items.length){

    toast(
      'Your Card is empty'
    );

    btn.disabled = false;

    btn.textContent =
      'Place Order';

    return;
  }


  /* =========================
     GENERATE ORDER ID
  ========================= */

  const orderId =
    crypto.randomUUID();


  btn.textContent =
    'Placing Order...';


  /* =========================
     ATOMIC ORDER + STOCK
  ========================= */

  const {error} =
    await supabaseClient.rpc(
      'place_order_with_stock',
      {

        p_order_id:
          orderId,

        p_shop_id:
          shop.id,

        p_customer_name:
          customer.name,

        p_customer_phone:
          customer.phone,

        p_customer_address:
          customer.address,

        p_landmark:
          customer.landmark ||
          '',

        p_pincode:
          customer.pincode,

        p_total_amount:
          total,

        p_items:
          items

      }
    );


  /* =========================
     ORDER ERROR
  ========================= */

  if(error){

    console.error(
      'PLACE ORDER ERROR',
      error
    );


    let message =
      error.message ||
      'Order could not be placed';


    if(
      message
        .toLowerCase()
        .includes('not enough stock')
    ){

      await refreshProducts();

      message =
        'Sorry, some product does not have enough stock. Please check the available quantity again.';
    }


    toast(message);


    btn.disabled = false;

    btn.textContent =
      'Place Order';

    return;
  }


  /* =========================
     REFRESH STOCK
  ========================= */

  await refreshProducts();


  /* =========================
     CLEAR CARD
  ========================= */

  card = [];

  saveCard();


  /* =========================
     SUCCESS
  ========================= */

  document.getElementById(
    'checkoutBox'
  ).innerHTML = `

    <div class="success">

      <div class="successIcon">
        ✓
      </div>


      <h2>
        Order Placed Successfully
      </h2>


      <p>

        Your order has been received.
        <br>

        Order ID:

        <strong>
          ${esc(
            orderId
              .slice(0,8)
              .toUpperCase()
          )}
        </strong>

      </p>


      <button
        class="back"
        type="button"
        onclick="closeCheckout()">

        Continue Shopping

      </button>

    </div>

  `;

}

window.addEventListener(

  init
);
