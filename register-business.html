<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Shop & Owner | My Consultant Services</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase.js"></script>

<style>
:root {
  color-scheme: dark;
  --bg: #0b1120;
  --panel: #111827;
  --line: #263244;
  --muted: #94a3b8;
  --blue: #2563eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: #f8fafc;
  font: 16px/1.5 Arial, sans-serif;
}

main {
  width: min(920px, 100%);
  margin: auto;
  padding: clamp(16px, 4vw, 36px);
}

header {
  margin-bottom: 24px;
}

h1 {
  font-size: clamp(24px, 4vw, 34px);
  margin: 0 0 8px;
}

p {
  color: var(--muted);
  margin: 0;
}

.notice {
  padding: 13px 15px;
  border: 1px solid #854d0e;
  background: #422006;
  color: #fde68a;
  border-radius: 12px;
  margin: 18px 0;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: clamp(16px, 3vw, 26px);
}

h2 {
  font-size: 18px;
  margin: 22px 0 12px;
}

.panel h2:first-child {
  margin-top: 0;
}

.fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  min-width: 0;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  font-size: 13px;
  color: #cbd5e1;
  margin-bottom: 6px;
}

input,
textarea,
select {
  width: 100%;
  min-width: 0;
  border: 1px solid #334155;
  background: #0f172a;
  color: white;
  border-radius: 9px;
  padding: 12px;
  font: inherit;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 10px;
  background: var(--blue);
  color: white;
  padding: 13px 18px;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

#message {
  display: none;
  white-space: pre-wrap;
  padding: 12px 14px;
  border-radius: 10px;
  margin-top: 16px;
}

#message.ok {
  display: block;
  background: #052e2b;
  border: 1px solid #0f766e;
  color: #99f6e4;
}

#message.err {
  display: block;
  background: #450a0a;
  border: 1px solid #991b1b;
  color: #fecaca;
}

@media (max-width: 600px) {
  .fields {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }

  .actions button {
    width: 100%;
  }
}
</style>
</head>

<body>
<main>

<header>
  <h1>Create a Shop & Owner Account</h1>
  <p>Master-only shop creation page.</p>
</header>

<div class="notice">
  <strong>Important:</strong>
  This page requires a signed-in Master account.
  It is not public self-registration.
</div>

<section class="panel">
<form id="createForm">

  <h2>Shop details</h2>

  <div class="fields">

    <div class="field">
      <label for="shopName">Business / Shop name *</label>
      <input id="shopName" required maxlength="120"
             autocomplete="organization">
    </div>

    <div class="field">
      <label for="slug">Shop URL slug *</label>
      <input id="slug" required pattern="[a-z0-9-]+"
             maxlength="80" placeholder="my-shop"
             autocomplete="off">
      <small style="color:#94a3b8">
        Lowercase letters, numbers and hyphens only.
      </small>
    </div>

    <div class="field">
      <label for="shopPhone">Shop phone</label>
      <input id="shopPhone" type="tel" autocomplete="tel">
    </div>

    <div class="field">
      <label for="whatsapp">WhatsApp number</label>
      <input id="whatsapp" type="tel">
    </div>

    <div class="field full">
      <label for="address">Address</label>
      <input id="address" autocomplete="street-address">
    </div>

    <div class="field full">
      <label for="description">Business description</label>
      <textarea id="description" maxlength="1000"></textarea>
    </div>

    <div class="field">
      <label for="status">Initial shop status</label>
      <select id="status">
        <option value="active">Active</option>
        <option value="maintenance">Maintenance</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>

  </div>

  <h2>Owner account</h2>

  <div class="fields">

    <div class="field">
      <label for="fullName">Owner full name</label>
      <input id="fullName" autocomplete="name">
    </div>

    <div class="field">
      <label for="ownerPhone">Owner phone</label>
      <input id="ownerPhone" type="tel" autocomplete="tel">
    </div>

    <div class="field">
      <label for="email">Owner email *</label>
      <input id="email" type="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Temporary password *</label>
      <input id="password" type="password" required
             minlength="6" autocomplete="new-password">
    </div>

  </div>

  <div class="actions">
    <button id="submitBtn" type="submit">
      Create Shop & Owner
    </button>
    <span id="statusText" aria-live="polite"
          style="color:#94a3b8"></span>
  </div>

  <div id="message" role="status" aria-live="polite"></div>

</form>
</section>
</main>

<script>
const form = document.getElementById("createForm");
const submitBtn = document.getElementById("submitBtn");
const messageBox = document.getElementById("message");
const statusText = document.getElementById("statusText");

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = type;
}

function makeSlug(value) {
  return value
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

document.getElementById("shopName").addEventListener("input", () => {
  const slugInput = document.getElementById("slug");

  if (!slugInput.dataset.edited) {
    slugInput.value = makeSlug(
      document.getElementById("shopName").value
    );
  }
});

document.getElementById("slug").addEventListener("input", event => {
  event.target.dataset.edited = "1";
  event.target.value = event.target.value
    .toLowerCase()
    .replace(/[^a-z0-9-]/g, "");
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  messageBox.className = "";
  messageBox.textContent = "";

  submitBtn.disabled = true;
  statusText.textContent = "Checking Master session…";

  try {
    if (!window.supabaseClient) {
      throw new Error(
        "Supabase client not loaded. Check js/supabase.js."
      );
    }

    const { data: sessionData, error: sessionError } =
      await supabaseClient.auth.getSession();

    if (sessionError) throw sessionError;

    const session = sessionData?.session;

    if (!session?.access_token) {
      throw new Error(
        "Please sign in with the Master account first."
      );
    }

    const { data: me, error: meError } =
      await supabaseClient
        .from("owners")
        .select("id, role")
        .eq("id", session.user.id)
        .maybeSingle();

    if (meError) throw meError;

    if (!me || me.role !== "master") {
      throw new Error(
        "Master access required. This account is not a Master."
      );
    }

    const payload = {
      shop: {
        name: document.getElementById("shopName").value.trim(),
        slug: document.getElementById("slug").value.trim().toLowerCase(),
        phone: document.getElementById("shopPhone").value.trim() || null,
        whatsapp: document.getElementById("whatsapp").value.trim() || null,
        address: document.getElementById("address").value.trim() || null,
        description: document.getElementById("description").value.trim() || null,
        status: document.getElementById("status").value
      },

      owner: {
        full_name: document.getElementById("fullName").value.trim(),
        phone: document.getElementById("ownerPhone").value.trim() || null,
        email: document.getElementById("email").value.trim().toLowerCase(),
        password: document.getElementById("password").value
      }
    };

    statusText.textContent = "Creating shop and owner…";

    const { data, error } =
      await supabaseClient.functions.invoke("create-shop-owner", {
        body: payload,
        headers: {
          Authorization: "Bearer " + session.access_token
        }
      });

    if (error) {
      let detail = error.message || "Edge Function request failed.";

      try {
        const response = error.context;

        if (response && typeof response.json === "function") {
          const body = await response.json();
          if (body?.error) detail = body.error;
        }
      } catch (_) {}

      throw new Error(detail);
    }

    if (!data?.success) {
      throw new Error(
        data?.error || "The function did not confirm creation."
      );
    }

    showMessage(
      "Created successfully.\n" +
      "Shop: " + (data.shop?.name || payload.shop.name) + "\n" +
      "Slug: " + (data.shop?.slug || payload.shop.slug) + "\n" +
      "Owner: " + (
        data.owner?.full_name ||
        payload.owner.full_name ||
        payload.shop.name
      ) +
      "\n\nThe owner can now sign in using the email and password you set.",
      "ok"
    );

    form.reset();
    document.getElementById("slug").dataset.edited = "";
    statusText.textContent = "";

  } catch (error) {
    console.error("Create shop/owner error:", error);

    showMessage(
      error?.message || "Could not create shop and owner.",
      "err"
    );

    statusText.textContent = "";

  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
