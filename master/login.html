<body>

  <div class="login-box">

    <div class="logo">M</div>

    <h1>Master Login</h1>

    <p class="subtitle">
      Local Shop Platform
    </p>

    <div id="errorMessage" class="message error"></div>

    <div id="successMessage" class="message success"></div>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter master email"
          required
          autocomplete="email"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        >

      </div>

      <button
        type="submit"
        id="loginButton"
        class="login-btn"
      >
        Login
      </button>

    </form>

    <div class="footer">
      Master Control Panel
    </div>

  </div>


  <script>

    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");


    function showError(message) {

      errorMessage.textContent = message;
      errorMessage.style.display = "block";

      successMessage.style.display = "none";
    }


    function showSuccess(message) {

      successMessage.textContent = message;
      successMessage.style.display = "block";

      errorMessage.style.display = "none";
    }


    function hideMessages() {

      errorMessage.style.display = "none";
      successMessage.style.display = "none";
    }


    async function login() {

      hideMessages();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showError("Please enter email and password.");

        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        /*
         * STEP 1
         * Login through Supabase Auth
         */

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


        if (error) {
          throw error;
        }


        if (!data || !data.user) {

          throw new Error(
            "Login failed. User session was not created."
          );

        }


        /*
         * STEP 2
         * Check master role
         */

        const {
          data: master,
          error: masterError
        } = await supabaseClient
          .from("owners")
          .select("full_name, role, shop_id")
          .eq("id", data.user.id)
          .single();


        if (masterError) {
          throw masterError;
        }


        /*
         * STEP 3
         * Only MASTER can enter this panel
         */

        if (!master || master.role !== "master") {

          await supabaseClient.auth.signOut();

          throw new Error(
            "Access denied. This account is not a master account."
          );

        }


        /*
         * STEP 4
         * Successful login
         */

        showSuccess(
          "Login successful. Opening Master Dashboard..."
        );


        setTimeout(() => {

          window.location.href = "dashboard.html";

        }, 700);


      } catch (error) {

        console.error(
          "MASTER LOGIN ERROR:",
          error
        );


        showError(
          error?.message ||
          "Login failed. Please try again."
        );


        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    }


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        login();

      }
    );


    /*
     * If a master is already logged in,
     * send directly to dashboard.
     */

    async function checkExistingSession() {

      try {

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {
          return;
        }


        const {
          data: master
        } = await supabaseClient
          .from("owners")
          .select("role")
          .eq("id", session.user.id)
          .single();


        if (master && master.role === "master") {

          window.location.href = "dashboard.html";

        }

      } catch (error) {

        console.error(
          "SESSION CHECK ERROR:",
          error
        );

      }

    }


    window.addEventListener(
      "load",
      checkExistingSession
    );

  </script>

</body>
