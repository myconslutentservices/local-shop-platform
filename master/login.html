<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Master Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Master Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Master Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="message"></p>

  </div>

  <script>
    async function login() {

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      message.textContent = "Logging in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        console.error(error);
        message.textContent = "❌ " + error.message;
        return;
      }

      message.textContent = "✅ Login successful!";

      console.log("Logged in user:", data.user);
    }
  </script>

</body>
</html>
