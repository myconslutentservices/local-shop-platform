<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Master Login | Local Shop Platform</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 60px;
      height: 60px;
      background: #111827;
      color: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
      background: #ffffff;
    }

    input:focus {
      border-color: #111827;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #1f2937;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      M
    </div>

    <h1>Master Login</h1>

    <p class="subtitle">
      Local Shop Platform
    </p>

    <div id="errorMessage" class="message error"></div>

    <div id="successMessage" class="message success"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter master email"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        >
      </div>

      <button
        type="submit"
        id="loginButton"
        class="login-btn"
      >
        Login
      </button>

    </form>

    <div class="footer">
      Master Control Panel
    </div>

  </div>


  <script>

    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");


    function showError(message) {

      errorMessage.textContent = message;
      errorMessage.style.display = "block";

      successMessage.style.display = "none";
    }


    function showSuccess(message) {

      successMessage.textContent = message;
      successMessage.style.display = "block";

      errorMessage.style.display = "none";
    }


    function hideMessages() {

      errorMessage.style.display = "none";
      successMessage.style.display = "none";
    }


    async function login() {

      hideMessages();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!email || !password) {

        showError("Please enter email and password.");

        return;
      }


      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";


      try {

        /*
         * STEP 1
         * Login through Supabase Auth
         */

        const {
          data,
          error
        } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


        if (error) {
          throw error;
        }


        if (!data || !data.user) {

          throw new Error(
            "Login failed. User session was not created."
          );

        }


        /*
         * STEP 2
         * Check master role
         */

        const {
          data: master,
          error: masterError
        } = await supabaseClient
          .from("owners")
          .select("full_name, role, shop_id")
          .eq("id", data.user.id)
          .single();


        if (masterError) {
          throw masterError;
        }


        /*
         * STEP 3
         * Only MASTER can enter this panel
         */

        if (!master || master.role !== "master") {

          await supabaseClient.auth.signOut();

          throw new Error(
            "Access denied. This account is not a master account."
          );

        }


        /*
         * STEP 4
         * Successful login
         */

        showSuccess(
          "Login successful. Opening Master Dashboard..."
        );


        /*
         * Dashboard file name:
         * master-dashboard.html
         */

        setTimeout(() => {

          window.location.href =
            "master-dashboard.html";

        }, 700);


      } catch (error) {

        console.error(
          "MASTER LOGIN ERROR:",
          error
        );


        showError(
          error?.message ||
          "Login failed. Please try again."
        );


        loginButton.disabled = false;
        loginButton.textContent = "Login";

      }

    }


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();

        login();

      }
    );


    /*
     * If a master is already logged in,
     * send directly to dashboard.
     */

    async function checkExistingSession() {

      try {

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {
          return;
        }


        const {
          data: master
        } = await supabaseClient
          .from("owners")
          .select("role")
          .eq("id", session.user.id)
          .single();


        if (master && master.role === "master") {

          window.location.href =
            "master-dashboard.html";

        }

      } catch (error) {

        console.error(
          "SESSION CHECK ERROR:",
          error
        );

      }

    }


    window.addEventListener(
      "load",
      checkExistingSession
    );

  </script>

</body>
</html>
