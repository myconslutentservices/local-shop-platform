<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Master Login</title>

  <!-- Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Configuration -->
  <script src="../js/supabase.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .login-box {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>Master Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Master Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="message"></p>

  </div>

  <script>

    async function login() {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "❌ Email and password required";
        return;
      }

      message.textContent = "Logging in...";

      // Supabase Authentication
      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      // Login failed
      if (error) {
        console.error(error);
        message.textContent = "❌ " + error.message;
        return;
      }

      console.log("Logged in user:", data.user);

      // Verify Master Role
      const { data: master, error: roleError } =
        await supabaseClient
          .from("owners")
          .select("full_name, role, shop_id")
          .eq("id", data.user.id)
          .single();

      // Role verification failed
      if (roleError) {
        console.error(roleError);

        await supabaseClient.auth.signOut();

        message.textContent =
          "❌ Master role verification failed";

        return;
      }

      // User is not Master
      if (master.role !== "master") {

        await supabaseClient.auth.signOut();

        message.textContent =
          "❌ Access denied";

        return;
      }

      // Master verified
      message.textContent =
        "✅ Master verified successfully!";

      console.log("Master:", master);

    }

  </script>

</body>
</html>
