<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

  <div>

    <h1>Notifications</h1>

    <small>
      Manage platform notifications
    </small>

  </div>


  <button
    class="secondary"
    onclick="location.href='dashboard.html'"
  >
    ← Dashboard
  </button>

</div>


<!-- =========================
     MAIN
     ========================= -->

<div class="container">


  <div id="errorBox" class="error"></div>


  <!-- CREATE NOTIFICATION -->

  <div class="card">

    <h2 style="margin-top:0">
      Create Notification
    </h2>


    <div class="field">

      <label for="title">
        Title
      </label>

      <input
        id="title"
        placeholder="Notification title"
        autocomplete="off"
      >

    </div>


    <div class="field">

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        placeholder="Write notification message..."
      ></textarea>

    </div>


    <div class="field">

      <label for="type">
        Type
      </label>

      <select id="type">

        <option value="general">
          General
        </option>

        <option value="important">
          Important
        </option>

        <option value="update">
          Update
        </option>

        <option value="warning">
          Warning
        </option>

      </select>

    </div>


    <button
      class="primary"
      onclick="createNotification()"
    >
      Publish Notification
    </button>

  </div>


  <!-- TOOLBAR -->

  <div class="toolbar">

    <button
      class="primary"
      onclick="loadNotifications()"
    >
      ↻ Refresh
    </button>

  </div>


  <!-- NOTIFICATION LIST -->

  <div class="card">

    <div id="notificationList"></div>

  </div>


</div>


<script>

let notifications=[];


/* =========================
   ESCAPE HTML
   ========================= */

function esc(v){

  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   ERROR
   ========================= */

function showError(msg){

  const box=document.getElementById("errorBox");

  box.textContent=msg;

  box.style.display="block";

}


function clearError(){

  document.getElementById("errorBox").style.display="none";

}


/* =========================
   MASTER AUTH
   ========================= */

async function checkMaster(){

  const {
    data:{session}
  }=await supabaseClient.auth.getSession();


  if(!session){

    location.href="login.html";

    return false;

  }


  const {
    data,
    error
  }=await supabaseClient
    .from("owners")
    .select("role")
    .eq("id",session.user.id)
    .maybeSingle();


  if(error || !data || data.role!=="master"){

    await supabaseClient.auth.signOut();

    location.href="login.html";

    return false;

  }


  return true;

}


/* =========================
   LOAD NOTIFICATIONS
   ========================= */

async function loadNotifications(){

  clearError();


  const {
    data,
    error
  }=await supabaseClient
    .from("notifications")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    showError(error.message);

    return;

  }


  notifications=data||[];

  render();

}


/* =========================
   RENDER
   ========================= */

function render(){

  const box=document.getElementById(
    "notificationList"
  );


  if(!notifications.length){

    box.innerHTML=`

      <div class="empty">

        No notifications yet.

      </div>

    `;

    return;

  }


  box.innerHTML=notifications.map(n=>{

    const title=
      n.title ||
      n.subject ||
      "Notification";


    const message=
      n.message ||
      n.body ||
      n.description ||
      "";


    const type=
      n.type ||
      "general";


    return `

      <div class="notification">

        <div class="notification-head">

          <div style="min-width:0">

            <h3>
              ${esc(title)}
            </h3>

            <div class="message">
              ${esc(message)}
            </div>

          </div>


          <span class="badge">
            ${esc(type)}
          </span>

        </div>


        <div class="meta">

          ${
            n.created_at
              ? new Date(
                  n.created_at
                ).toLocaleString()
              : "—"
          }

        </div>


        <div style="margin-top:12px">

          <button
            class="danger"
            onclick="deleteNotification('${esc(n.id)}')"
          >
            Delete
          </button>

        </div>

      </div>

    `;

  }).join("");

}


/* =========================
   CREATE
   ========================= */

async function createNotification(){

  clearError();


  const title=
    document.getElementById(
      "title"
    ).value.trim();


  const message=
    document.getElementById(
      "message"
    ).value.trim();


  const type=
    document.getElementById(
      "type"
    ).value;


  if(!title || !message){

    showError(
      "Title and message are required."
    );

    return;

  }


  const {
    error
  }=await supabaseClient
    .from("notifications")
    .insert({
      title,
      message,
      type
    });


  if(error){

    showError(error.message);

    return;

  }


  document.getElementById(
    "title"
  ).value="";


  document.getElementById(
    "message"
  ).value="";


  document.getElementById(
    "type"
  ).value="general";


  await loadNotifications();

}


/* =========================
   DELETE
   ========================= */

async function deleteNotification(id){

  if(
    !confirm(
      "Delete this notification?"
    )
  ){

    return;

  }


  const {
    error
  }=await supabaseClient
    .from("notifications")
    .delete()
    .eq("id",id);


  if(error){

    showError(error.message);

    return;

  }


  await loadNotifications();

}


/* =========================
   START
   ========================= */

(async()=>{

  if(await checkMaster()){

    await loadNotifications();

  }

})();

</script>

</body>
</html>
