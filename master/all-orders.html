<main class="container">
<div class="page-title"><h1>All Orders</h1><p>View and manage customer orders from all shops.</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:18px"><span style="padding:7px 10px;border:1px solid rgba(0,168,255,.22);border-radius:9px;background:rgba(22,119,255,.08);color:#a9dfff;font-size:10px;font-weight:800;letter-spacing:.08em">LIVE ORDER DATA</span><button class="top-btn" type="button" id="refreshOrdersBtn">↻ Refresh Orders</button></div></div>

<div id="successBox" role="status" aria-live="polite" style="display:none;margin-bottom:15px;padding:12px 14px;border:1px solid rgba(0,214,160,.25);border-radius:11px;background:rgba(0,214,160,.08);color:#7af2d1;font-size:12px"></div>
<section class="stats"><div class="stat-card"><div class="stat-label">Total Orders</div><div class="stat-value" id="totalOrders">0</div></div><div class="stat-card"><div class="stat-label">New Orders</div><div class="stat-value" id="newOrders">0</div></div><div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value" id="totalRevenue">₹0</div></div><div class="stat-card"><div class="stat-label">Cancelled Orders</div><div class="stat-value" id="cancelledOrders">0</div></div><div class="stat-card"><div class="stat-label">Pending Payments</div><div class="stat-value" id="pendingPayments">0</div></div></section>
<section class="filter-box"><div class="filter-grid"><div class="field"><label>Search</label><input id="searchInput" type="text" placeholder="Customer, phone or Order ID..." oninput="applyFilters()" /></div><div class="field"><label>Shop</label><select id="shopFilter" onchange="applyFilters()"><option value="">All Shops</option></select></div><div class="field"><label>Order Status</label><select id="statusFilter" onchange="applyFilters()"><option value="">All Status</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="out_for_delivery">Out for Delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div class="field"><label>Payment Status</label><select id="paymentFilter" onchange="applyFilters()"><option value="">All Payments</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="refunded">Refunded</option></select></div></div></section>
<div class="orders-header"><h2>Orders</h2><div class="result-count" id="resultCount">0 orders</div></div><div id="ordersContainer"><div class="message-box">Loading orders...</div></div>
</main>
<div class="modal-overlay" id="orderModal" role="dialog" aria-modal="true" aria-labelledby="orderDetailsTitle"><div class="modal"><div class="modal-header"><h3 id="orderDetailsTitle">Order Details</h3><button class="close-btn" onclick="closeOrderModal()">×</button></div><div id="orderDetails">Loading...</div><div class="modal-footer"><button class="close-main" onclick="closeOrderModal()">Close</button></div></div></div>
<script>
let allOrders=[],allShops=[];
function showError(message){const box=document.getElementById("errorBox");box.textContent=message;box.style.display="block";const retry=document.createElement("button");retry.type="button";retry.textContent="Retry";retry.style.cssText="margin-left:12px;padding:7px 10px;border-radius:8px;background:#101d3d;color:#fff;border:1px solid rgba(70,120,255,.3)";retry.onclick=()=>startPage();box.appendChild(retry)}function clearError(){const box=document.getElementById("errorBox");box.textContent="";box.style.display="none"}let successTimer=null;function showSuccess(message){const box=document.getElementById("successBox");box.textContent=message;box.style.display="block";if(successTimer)clearTimeout(successTimer);successTimer=setTimeout(()=>box.style.display="none",3500)}function formatPrice(value){return "₹"+Number(value||0).toLocaleString("en-IN",{minimumFractionDigits:0,maximumFractionDigits:2})}function escapeHtml(value){return String(value??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function formatDateTime(value){if(!value)return "-";const date=new Date(value);if(Number.isNaN(date.getTime()))return "-";return date.toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}function getShop(shopId){return allShops.find(shop=>shop.id===shopId)}function goDashboard(){window.location.href="dashboard.html"}function goShops(){window.location.href="shops.html"}async function logout(){await supabaseClient.auth.signOut();window.location.href="login.html"}
async function verifyMaster(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){window.location.href="login.html";return false}const{data:owner,error}=await supabaseClient.from("owners").select("id, full_name, role, shop_id").eq("id",session.user.id).maybeSingle();if(error)throw error;if(!owner||owner.role!=="master"){await supabaseClient.auth.signOut();window.location.href="login.html";return false}return true}
async function loadShops(){const{data,error}=await supabaseClient.from("shops").select("id, name, slug").order("name",{ascending:true});if(error)throw error;allShops=data||[];const select=document.getElementById("shopFilter");select.innerHTML='<option value="">All Shops</option>';allShops.forEach(shop=>{const option=document.createElement("option");option.value=shop.id;option.textContent=shop.name||shop.slug||"Unnamed Shop";select.appendChild(option)})}
async function loadOrders(){const{data,error}=await supabaseClient.from("orders").select(`id,shop_id,customer_name,customer_phone,customer_address,customer_landmark,customer_pincode,landmark,pincode,total_amount,status,payment_status,notes,created_at,updated_at`).order("created_at",{ascending:false});if(error)throw error;allOrders=data||[];updateStats();applyFilters()}
function isToday(dateValue){if(!dateValue)return false;const date=new Date(dateValue),now=new Date();return date.getFullYear()===now.getFullYear()&&date.getMonth()===now.getMonth()&&date.getDate()===now.getDate()}
function updateStats(){const total=allOrders.length,newOrders=allOrders.filter(o=>o.status==="new"),cancelled=allOrders.filter(o=>o.status==="cancelled"),pendingPayments=allOrders.filter(o=>o.payment_status==="pending");const totalRevenue=allOrders.reduce((sum,o)=>o.payment_status==="paid"&&o.status!=="cancelled"?sum+Number(o.total_amount||0):sum,0);document.getElementById("totalOrders").textContent=total;document.getElementById("newOrders").textContent=newOrders.length;document.getElementById("totalRevenue").textContent=formatPrice(totalRevenue);document.getElementById("cancelledOrders").textContent=cancelled.length;document.getElementById("pendingPayments").textContent=pendingPayments.length}
function applyFilters(){const search=document.getElementById("searchInput").value.trim().toLowerCase(),shopId=document.getElementById("shopFilter").value,status=document.getElementById("statusFilter").value,payment=document.getElementById("paymentFilter").value;let filtered=[...allOrders];if(search)filtered=filtered.filter(order=>String(order.id||"").toLowerCase().includes(search)||String(order.customer_name||"").toLowerCase().includes(search)||String(order.customer_phone||"").toLowerCase().includes(search));if(shopId)filtered=filtered.filter(order=>order.shop_id===shopId);if(status)filtered=filtered.filter(order=>order.status===status);if(payment)filtered=filtered.filter(order=>order.payment_status===payment);renderOrders(filtered)}
const statusLabels={new:"New",confirmed:"Confirmed",preparing:"Preparing",out_for_delivery:"Out for Delivery",delivered:"Delivered",cancelled:"Cancelled"},statusClasses={new:"status-new",confirmed:"status-confirmed",preparing:"status-preparing",out_for_delivery:"status-out",delivered:"status-delivered",cancelled:"status-cancelled"},paymentLabels={pending:"Pending",paid:"Paid",failed:"Failed",refunded:"Refunded"},paymentClasses={pending:"payment-pending",paid:"payment-paid",failed:"payment-failed",refunded:"payment-refunded"};function getStatusLabel(s){return statusLabels[s]||s||"Unknown"}function getStatusClass(s){return statusClasses[s]||"status-new"}function getPaymentLabel(s){return paymentLabels[s]||s||"Pending"}function getPaymentClass(s){return paymentClasses[s]||"payment-pending"}
function renderOrders(orders){const container=document.getElementById("ordersContainer");document.getElementById("resultCount").textContent=`${orders.length} order${orders.length===1?"":"s"}`;if(!orders.length){container.innerHTML='<div class="message-box">No orders found.</div>';return}let html='<div class="table-wrapper"><table><thead><tr><th>Order</th><th>Shop</th><th>Customer</th><th>Amount</th><th>Order Status</th><th>Payment</th><th>Date</th><th>Action</th></tr></thead><tbody>';orders.forEach(order=>{const shop=getShop(order.shop_id),shortId=String(order.id).slice(0,8).toUpperCase();html+=`<tr><td><div class="order-id">#${escapeHtml(shortId)}</div><div class="phone">${escapeHtml(String(order.id))}</div></td><td><div class="shop-text">${escapeHtml(shop?.name||shop?.slug||"Unknown Shop")}</div></td><td><div class="customer-name">${escapeHtml(order.customer_name||"-")}</div><div class="phone">${escapeHtml(order.customer_phone||"-")}</div></td><td><div class="amount">${formatPrice(order.total_amount)}</div></td><td><select class="control-select" onchange="changeOrderStatus('${order.id}',this.value)"><option value="new" ${order.status==="new"?"selected":""}>New</option><option value="confirmed" ${order.status==="confirmed"?"selected":""}>Confirmed</option><option value="preparing" ${order.status==="preparing"?"selected":""}>Preparing</option><option value="out_for_delivery" ${order.status==="out_for_delivery"?"selected":""}>Out for Delivery</option><option value="delivered" ${order.status==="delivered"?"selected":""}>Delivered</option><option value="cancelled" ${order.status==="cancelled"?"selected":""}>Cancelled</option></select><div style="margin-top:6px"><span class="badge ${getStatusClass(order.status)}">${getStatusLabel(order.status)}</span></div></td><td><select class="control-select payment-select" onchange="changePaymentStatus('${order.id}',this.value)"><option value="pending" ${order.payment_status==="pending"?"selected":""}>Pending</option><option value="paid" ${order.payment_status==="paid"?"selected":""}>Paid</option><option value="failed" ${order.payment_status==="failed"?"selected":""}>Failed</option><option value="refunded" ${order.payment_status==="refunded"?"selected":""}>Refunded</option></select><div style="margin-top:6px"><span class="badge ${getPaymentClass(order.payment_status)}">${getPaymentLabel(order.payment_status)}</span></div></td><td>${formatDateTime(order.created_at)}</td><td><button class="view-btn" onclick="viewOrder('${order.id}')">View</button></td></tr>`});html+='</tbody></table></div>';container.innerHTML=html}
async function changeOrderStatus(orderId,newStatus){clearError();if(!allOrders.find(item=>item.id===orderId)){showError("Order not found.");return}try{const{error}=await supabaseClient.from("orders").update({status:newStatus}).eq("id",orderId);if(error)throw error;await loadOrders();showSuccess("Order status updated successfully.")}catch(error){console.error("ORDER STATUS ERROR:",error);showError(error?.message||"Order status could not be updated.");await loadOrders()}}
async function changePaymentStatus(orderId,newPaymentStatus){clearError();if(!allOrders.find(item=>item.id===orderId)){showError("Order not found.");return}try{const{error}=await supabaseClient.from("orders").update({payment_status:newPaymentStatus}).eq("id",orderId);if(error)throw error;await loadOrders();showSuccess("Payment status updated successfully.")}catch(error){console.error("PAYMENT STATUS ERROR:",error);showError(error?.message||"Payment status could not be updated.");await loadOrders()}}
async function viewOrder(orderId){clearError();const order=allOrders.find(item=>item.id===orderId);if(!order){showError("Order not found.");return}const modal=document.getElementById("orderModal"),details=document.getElementById("orderDetails");modal.style.display="flex";document.body.style.overflow="hidden";details.innerHTML='<div class="message-box">Loading order details...</div>';try{const{data:items,error}=await supabaseClient.from("order_items").select(`product_id,product_name,price,quantity,size,variant`).eq("order_id",orderId);if(error)throw error;renderOrderDetails(order,items||[])}catch(error){console.error("ORDER DETAILS ERROR:",error);details.innerHTML=`<div class="message-box">Could not load order items.<br><br>${escapeHtml(error?.message||"Unknown error")}</div>`}}
function renderOrderDetails(order,items){const shop=getShop(order.shop_id);let itemsHtml="";if(!items.length)itemsHtml='<tr><td colspan="6">No order items found.</td></tr>';else items.forEach(item=>{const lineTotal=Number(item.price||0)*Number(item.quantity||0);itemsHtml+=`<tr><td>${escapeHtml(item.product_name||"-")}</td><td>${formatPrice(item.price)}</td><td>${item.quantity||0}</td><td>${escapeHtml(item.size||"-")}</td><td>${escapeHtml(item.variant||"-")}</td><td>${formatPrice(lineTotal)}</td></tr>`});const address=order.customer_address||"-",landmark=order.landmark||order.customer_landmark||"-",pincode=order.pincode||order.customer_pincode||"-";document.getElementById("orderDetails").innerHTML=`<div class="detail-section"><h4>Order Information</h4><div class="detail-grid"><div class="detail-item"><span>Order ID</span><strong>${escapeHtml(order.id)}</strong></div><div class="detail-item"><span>Shop</span><strong>${escapeHtml(shop?.name||shop?.slug||"Unknown Shop")}</strong></div><div class="detail-item"><span>Order Status</span><strong><span class="badge ${getStatusClass(order.status)}">${getStatusLabel(order.status)}</span></strong></div><div class="detail-item"><span>Payment Status</span><strong><span class="badge ${getPaymentClass(order.payment_status)}">${getPaymentLabel(order.payment_status)}</span></strong></div><div class="detail-item"><span>Total Amount</span><strong>${formatPrice(order.total_amount)}</strong></div><div class="detail-item"><span>Created</span><strong>${formatDateTime(order.created_at)}</strong></div></div></div><div class="detail-section"><h4>Customer Details</h4><div class="detail-grid"><div class="detail-item"><span>Name</span><strong>${escapeHtml(order.customer_name||"-")}</strong></div><div class="detail-item"><span>Phone</span><strong>${escapeHtml(order.customer_phone||"-")}</strong></div><div class="detail-item"><span>Address</span><strong>${escapeHtml(address)}</strong></div><div class="detail-item"><span>Landmark</span><strong>${escapeHtml(landmark)}</strong></div><div class="detail-item"><span>Pincode</span><strong>${escapeHtml(pincode)}</strong></div></div></div><div class="detail-section"><h4>Ordered Products</h4><div style="overflow-x:auto"><table class="items-table"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Size</th><th>Variant</th><th>Total</th></tr></thead><tbody>${itemsHtml}</tbody></table></div></div>${order.notes?`<div class="detail-section"><h4>Notes</h4><div>${escapeHtml(order.notes)}</div></div>`:""}`}
function closeOrderModal(){document.getElementById("orderModal").style.display="none";document.body.style.overflow=""}function applyUrlFilter(){const shopId=new URLSearchParams(window.location.search).get("shop_id");if(!shopId||!allShops.some(shop=>shop.id===shopId))return;document.getElementById("shopFilter").value=shopId;applyFilters()}
async function startPage(){clearError();try{const isMaster=await verifyMaster();if(!isMaster)return;await loadShops();await loadOrders();applyUrlFilter()}catch(error){console.error("ALL ORDERS ERROR:",error);showError(error?.message||"Orders could not be loaded.")}}
document.getElementById("orderModal").addEventListener("click",function(event){if(event.target===document.getElementById("orderModal"))closeOrderModal()});document.addEventListener("keydown",function(event){if(event.key==="Escape")closeOrderModal()});document.getElementById("refreshOrdersBtn").addEventListener("click",async function(){const btn=this;btn.disabled=true;btn.textContent="Refreshing…";try{await startPage();showSuccess("Orders refreshed.")}finally{btn.disabled=false;btn.textContent="↻ Refresh Orders"}});window.addEventListener("load",startPage);
</script>
<script src="master-shell.js"></script>
</body>
</html>
