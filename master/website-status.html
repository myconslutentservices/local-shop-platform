<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Website Status | Master Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#111827;
}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.header{
  background:#111827;
  color:white;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
.header h1{margin:0;font-size:22px;line-height:1.25}
.header small{color:#cbd5e1;display:block;margin-top:4px}
.container{
  width:100%;
  max-width:1400px;
  margin:25px auto;
  padding:0 18px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px;
}
.stat{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.05);
  min-width:0;
}
.label{
  font-size:13px;
  color:#64748b;
}
.number{
  font-size:28px;
  font-weight:bold;
  margin-top:7px;
}
.toolbar{
  display:grid;
  grid-template-columns:minmax(220px,300px) minmax(150px,200px) auto;
  gap:10px;
  margin-bottom:18px;
}
input,select{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:14px;
  outline:none;
  background:white;
  color:#111827;
}
input:focus,select:focus{border-color:#111827}
.card{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
th,td{
  padding:13px 10px;
  border-bottom:1px solid #edf0f4;
  text-align:left;
  font-size:14px;
  vertical-align:middle;
}
th{
  background:#f8fafc;
  color:#475569;
  white-space:nowrap;
}
td{color:#334155}
td a{
  color:#2563eb;
  text-decoration:none;
  font-weight:bold;
}
td a:hover{text-decoration:underline}
.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}
.online{background:#dcfce7;color:#166534}
.offline{background:#fee2e2;color:#991b1b}
button{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  font-weight:bold;
  min-height:38px;
}
.primary{background:#111827;color:white}
.secondary{background:#e5e7eb;color:#111827}
.empty{
  text-align:center;
  padding:40px;
  color:#64748b;
}
.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  display:none;
  overflow-wrap:anywhere;
}

@media(min-width:1450px){
  .container{padding-left:24px;padding-right:24px}
}

@media(max-width:1100px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .primary{width:100%}
}

@media(max-width:700px){
  .header{
    padding:15px;
    align-items:flex-start;
  }
  .header h1{font-size:20px}
  .header small{font-size:12px}
  .header > button{
    flex-shrink:0;
    white-space:nowrap;
  }
  .container{
    margin:18px auto;
    padding:0 12px;
  }
  .stats{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .stat{
    padding:14px;
    border-radius:12px;
  }
  .number{font-size:24px}
  .toolbar{
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .toolbar .primary{width:100%}
  .card{
    padding:10px;
    border-radius:12px;
  }
  .table-wrap{overflow:visible}
  table{
    min-width:0;
    width:100%;
    border-collapse:separate;
    border-spacing:0 10px;
  }
  thead{display:none}
  tbody,tr,td{display:block;width:100%}
  tr{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:8px 12px;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
  }
  td{
    border:0;
    border-bottom:1px solid #eef1f5;
    padding:10px 0;
    display:grid;
    grid-template-columns:78px minmax(0,1fr);
    gap:10px;
    font-size:13px;
    overflow-wrap:anywhere;
  }
  td:last-child{border-bottom:0}
  td::before{
    font-weight:bold;
    color:#64748b;
  }
  td:nth-child(1)::before{content:"Shop"}
  td:nth-child(2)::before{content:"Slug"}
  td:nth-child(3)::before{content:"Website"}
  td:nth-child(4)::before{content:"Status"}
  td:nth-child(5)::before{content:"Created"}
  td:nth-child(6)::before{content:"Action"}
  td:nth-child(6) button{width:100%}
  .empty{
    padding:25px 10px;
    border:0;
  }
}

@media(max-width:420px){
  .header{
    flex-direction:column;
    align-items:stretch;
  }
  .header > button{width:100%}
  .container{padding:0 10px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:12px}
  .label{font-size:12px}
  .number{font-size:22px}
  .card{padding:8px}
  td{
    grid-template-columns:70px minmax(0,1fr);
    gap:8px;
    font-size:12px;
  }
}

@media(max-width:340px){
  .stats{grid-template-columns:1fr}
  .header h1{font-size:18px}
  .container{padding:0 8px}
  td{
    grid-template-columns:65px minmax(0,1fr);
  }
}

@media(hover:none){
  button:hover{filter:none}
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>Website Status</h1>
    <small>Monitor shop website status</small>
  </div>
  <button class="secondary" onclick="location.href='dashboard.html'">
    ← Dashboard
  </button>
</div>

<div class="container">

  <div id="errorBox" class="error"></div>

  <div class="stats">
    <div class="stat">
      <div class="label">Total Shops</div>
      <div class="number" id="total">0</div>
    </div>

    <div class="stat">
      <div class="label">Active Websites</div>
      <div class="number" id="active">0</div>
    </div>

    <div class="stat">
      <div class="label">Inactive Websites</div>
      <div class="number" id="inactive">0</div>
    </div>

    <div class="stat">
      <div class="label">Checked</div>
      <div class="number" id="checked">0</div>
    </div>
  </div>

  <div class="toolbar">
    <input
      id="search"
      class="search"
      placeholder="Search shop..."
      oninput="render()"
    >

    <select id="filter" onchange="render()">
      <option value="">All</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>

    <button class="primary" onclick="loadShops()">↻ Refresh</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Shop</th>
            <th>Slug</th>
            <th>Website</th>
            <th>Status</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="shopBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
let shops=[];

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showError(msg){
  const box=document.getElementById("errorBox");
  box.textContent=msg;
  box.style.display="block";
}

async function checkMaster(){
  const {data:{session}}=await supabaseClient.auth.getSession();

  if(!session){
    location.href="login.html";
    return false;
  }

  const {data,error}=await supabaseClient
    .from("owners")
    .select("role")
    .eq("id",session.user.id)
    .maybeSingle();

  if(error || !data || data.role!=="master"){
    await supabaseClient.auth.signOut();
    location.href="login.html";
    return false;
  }

  return true;
}

async function loadShops(){

  const {data,error}=await supabaseClient
    .from("shops")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    showError(error.message);
    return;
  }

  shops=data||[];

  document.getElementById("total").textContent=shops.length;
  document.getElementById("active").textContent=
    shops.filter(x=>x.is_active!==false).length;
  document.getElementById("inactive").textContent=
    shops.filter(x=>x.is_active===false).length;
  document.getElementById("checked").textContent=shops.length;

  render();
}

function render(){

  const q=document.getElementById("search").value.toLowerCase();
  const filter=document.getElementById("filter").value;

  const list=shops.filter(shop=>{

    const text=JSON.stringify(shop).toLowerCase();
    const active=shop.is_active!==false;

    return (
      (!q || text.includes(q)) &&
      (!filter ||
        (filter==="active" && active) ||
        (filter==="inactive" && !active))
    );
  });

  const body=document.getElementById("shopBody");

  if(!list.length){
    body.innerHTML=`
      <tr>
        <td colspan="6">
          <div class="empty">No shops found.</div>
        </td>
      </tr>`;
    return;
  }

  body.innerHTML=list.map(shop=>{

    const active=shop.is_active!==false;
    const slug=shop.slug||"";

    const website=slug
      ? `${location.origin}${location.pathname.replace("/master/website-status.html","")}/${slug}/`
      : "—";

    return `
      <tr>
        <td><b>${esc(shop.name||shop.shop_name||"Unnamed Shop")}</b></td>

        <td>${esc(slug||"—")}</td>

        <td>
          ${
            slug
            ? `<a href="../${esc(slug)}/" target="_blank">Open Website ↗</a>`
            : "—"
          }
        </td>

        <td>
          <span class="badge ${active?"online":"offline"}">
            ${active?"Active":"Inactive"}
          </span>
        </td>

        <td>
          ${shop.created_at
            ? new Date(shop.created_at).toLocaleString()
            : "—"}
        </td>

        <td>
          ${
            slug
            ? `<button class="primary"
                onclick="window.open('../${encodeURIComponent(slug)}/','_blank')">
                Visit
              </button>`
            : "—"
          }
        </td>
      </tr>
    `;
  }).join("");
}

(async()=>{
  if(await checkMaster()){
    await loadShops();
  }
})();
</script>

</body>
</html>
