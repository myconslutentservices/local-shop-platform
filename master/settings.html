<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Settings | Master Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111827;overflow-x:hidden}
.header{background:#111827;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:0;z-index:100;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.header h1{margin:0;font-size:22px}.header small{color:#cbd5e1}.container{max-width:1000px;margin:25px auto;padding:0 18px;width:100%}
.card{background:white;border-radius:14px;padding:22px;box-shadow:0 5px 20px rgba(0,0,0,.06);margin-bottom:18px}
h2{margin-top:0;font-size:22px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
input,select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;outline:none;min-height:42px;background:#fff}
input:focus,select:focus{border-color:#2563eb}button{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:bold;min-height:42px}.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}
.success{background:#dcfce7;color:#166534;padding:12px;border-radius:9px;margin-bottom:15px;display:none}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:9px;margin-bottom:15px;display:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.setting{border:1px solid #e5e7eb;padding:15px;border-radius:12px;margin-bottom:12px}.setting-title{font-weight:bold;margin-bottom:4px}.setting-desc{font-size:13px;color:#64748b;margin-bottom:10px}
@media(max-width:900px){.container{max-width:760px}.header{padding:16px 18px}.row{grid-template-columns:1fr 1fr}.card{padding:20px}}
@media(max-width:700px){.header{padding:15px;align-items:flex-start;flex-direction:column}.header button{width:100%}.container{margin:18px auto;padding:0 12px}.row{grid-template-columns:1fr}.card{padding:17px;border-radius:12px}h2{font-size:20px}.setting{padding:13px}.primary,.secondary{width:100%}}
@media(max-width:420px){.container{padding:0 10px;margin-top:14px}.header h1{font-size:20px}.header small{font-size:12px}.card{padding:14px}.setting{padding:12px}.setting-title{font-size:14px}.setting-desc{font-size:12px;line-height:1.45}input,select{font-size:14px}.success,.error{font-size:13px}}
@media(max-width:350px){.container{padding:0 8px}.card{padding:12px}button{padding:9px 12px}}
@media(hover:none){button:hover{transform:none}}
</style>

<style>
/* Settings page only — visual layer; application logic remains untouched. */
body.master-shell.master-settings {
  color-scheme: dark;
  background: #020817 !important;
  color: #fff !important;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
  overflow-x: hidden;
}
body.master-shell.master-settings .header {
  min-height: 82px !important;
  padding: 16px clamp(18px, 2.4vw, 32px) !important;
  display: flex !important;
  flex-direction: row !important;
  justify-content: space-between !important;
  align-items: center !important;
  gap: 16px !important;
  background: rgba(10, 24, 53, .96) !important;
  border-bottom: 1px solid rgba(70,120,255,.25) !important;
  box-shadow: 0 8px 28px rgba(0,0,0,.18) !important;
  backdrop-filter: blur(14px);
}
body.master-shell.master-settings .header h1 {
  margin: 0 0 4px !important;
  color: #fff !important;
  font-size: clamp(24px, 2vw, 28px) !important;
  font-weight: 700 !important;
  letter-spacing: -.035em !important;
  line-height: 1.2;
}
body.master-shell.master-settings .header small {
  color: #A9BCE0 !important;
  font-size: 13px !important;
  line-height: 1.5;
}
body.master-shell.master-settings .container.settings-container {
  width: 100% !important;
  max-width: 800px !important;
  margin: 0 auto !important;
  padding: 28px 20px 36px !important;
}
body.master-shell.master-settings .card {
  margin: 0 0 20px !important;
  padding: 24px !important;
  color: #fff !important;
  background: #0A1835 !important;
  border: 1px solid rgba(70,120,255,.25) !important;
  border-radius: 18px !important;
  box-shadow: 0 16px 38px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.018) !important;
}
body.master-shell.master-settings .card:last-child { margin-bottom: 0 !important; }
body.master-shell.master-settings .card h2 {
  margin: 0 0 20px !important;
  color: #fff !important;
  font-size: 21px !important;
  line-height: 1.35;
  font-weight: 700 !important;
  letter-spacing: -.025em !important;
}
body.master-shell.master-settings .setting {
  margin: 0 0 14px !important;
  padding: 16px !important;
  background: rgba(16,29,61,.42) !important;
  border: 1px solid rgba(70,120,255,.18) !important;
  border-radius: 13px !important;
  box-shadow: none !important;
}
body.master-shell.master-settings .setting-title {
  display: block;
  margin: 0 0 5px !important;
  color: #EAF1FF !important;
  font-size: 14px !important;
  line-height: 1.4;
  font-weight: 650 !important;
}
body.master-shell.master-settings .setting-desc {
  margin: 0 0 11px !important;
  color: #A9BCE0 !important;
  font-size: 12.5px !important;
  line-height: 1.55;
}
body.master-shell.master-settings input,
body.master-shell.master-settings select {
  display: block;
  width: 100% !important;
  min-height: 46px !important;
  padding: 11px 13px !important;
  color: #fff !important;
  background-color: #101D3D !important;
  border: 1px solid rgba(92,137,224,.36) !important;
  border-radius: 10px !important;
  font: inherit;
  font-size: 14px !important;
  box-shadow: none !important;
  transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
}
body.master-shell.master-settings input::placeholder {
  color: #8298BE !important;
  opacity: 1;
}
body.master-shell.master-settings input:focus,
body.master-shell.master-settings select:focus {
  background-color: #122348 !important;
  border-color: #00A8FF !important;
  box-shadow: 0 0 0 3px rgba(0,168,255,.17) !important;
  outline: none !important;
}
body.master-shell.master-settings select {
  color-scheme: dark;
  cursor: pointer;
}
body.master-shell.master-settings button {
  min-height: 44px !important;
  padding: 11px 19px !important;
  border-radius: 10px !important;
  font-size: 14px !important;
  font-weight: 650 !important;
  line-height: 1.3;
  transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, filter .18s ease, transform .18s ease;
}
body.master-shell.master-settings button.primary {
  color: #fff !important;
  background: linear-gradient(135deg,#1677FF,#00A8FF) !important;
  border: 1px solid rgba(0,217,255,.28) !important;
  box-shadow: 0 8px 22px rgba(22,119,255,.2) !important;
}
body.master-shell.master-settings button.primary:hover {
  filter: brightness(1.08);
  box-shadow: 0 10px 26px rgba(22,119,255,.27) !important;
}
body.master-shell.master-settings button.secondary {
  flex: 0 0 auto;
  color: #F1F6FF !important;
  background: #101D3D !important;
  border: 1px solid rgba(70,120,255,.34) !important;
  box-shadow: none !important;
}
body.master-shell.master-settings button.secondary:hover {
  background: #17284D !important;
  border-color: rgba(0,168,255,.55) !important;
}
body.master-shell.master-settings button:focus-visible {
  outline: 3px solid rgba(0,217,255,.75) !important;
  outline-offset: 3px;
}
body.master-shell.master-settings .row {
  grid-template-columns: repeat(2,minmax(0,1fr)) !important;
  gap: 18px !important;
}
body.master-shell.master-settings .row > div {
  min-width: 0;
  padding: 15px 16px;
  background: rgba(16,29,61,.48);
  border: 1px solid rgba(70,120,255,.17);
  border-radius: 12px;
}
body.master-shell.master-settings .row b {
  display: block;
  margin-bottom: 7px;
  color: #A9BCE0 !important;
  font-size: 13px;
  font-weight: 650;
}
body.master-shell.master-settings .row p {
  margin: 0 !important;
  color: #fff !important;
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
body.master-shell.master-settings #successBox,
body.master-shell.master-settings #errorBox {
  margin: 0 0 16px !important;
  border-radius: 10px !important;
  font-size: 13px;
  line-height: 1.5;
}
@media (max-width: 900px) {
  body.master-shell.master-settings .container.settings-container { padding: 22px 18px 30px !important; }
  body.master-shell.master-settings .card { padding: 21px !important; }
}
@media (max-width: 760px) {
  body.master-shell.master-settings .header {
    padding: 15px 16px 15px 64px !important;
    min-height: 76px !important;
  }
  body.master-shell.master-settings .container.settings-container {
    padding: 20px 14px 28px !important;
  }
}
@media (max-width: 560px) {
  body.master-shell.master-settings .header {
    align-items: flex-start !important;
    flex-wrap: wrap !important;
    gap: 12px !important;
  }
  body.master-shell.master-settings .header > div { flex: 1 1 170px; min-width: 0; }
  body.master-shell.master-settings .header button.secondary { min-height: 44px !important; }
  body.master-shell.master-settings .container.settings-container { padding: 18px 16px 26px !important; }
  body.master-shell.master-settings .card {
    padding: 16px !important;
    border-radius: 16px !important;
  }
  body.master-shell.master-settings .card h2 { margin-bottom: 16px !important; font-size: 20px !important; }
  body.master-shell.master-settings .setting { padding: 13px !important; margin-bottom: 12px !important; }
  body.master-shell.master-settings .row { grid-template-columns: 1fr !important; gap: 12px !important; }
  body.master-shell.master-settings button.primary { width: 100% !important; }
}
@media (max-width: 380px) {
  body.master-shell.master-settings .header { padding-right: 12px !important; }
  body.master-shell.master-settings .header button.secondary { width: 100% !important; }
  body.master-shell.master-settings .container.settings-container { padding-right: 12px !important; padding-left: 12px !important; }
}
@media (hover: none) {
  body.master-shell.master-settings button:hover { filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  body.master-shell.master-settings *,
  body.master-shell.master-settings *::before,
  body.master-shell.master-settings *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>

<body class="master-settings">
<div class="header"><div><h1>Settings</h1><small>Manage master platform settings</small></div><button class="secondary" onclick="location.href='dashboard.html'">← Dashboard</button></div>
<div class="container settings-container">
<div id="successBox" class="success"></div><div id="errorBox" class="error"></div>
<div class="card"><h2>Platform Settings</h2>
<div class="setting"><label class="setting-title" for="platform_name">Platform Name</label><div class="setting-desc">Main name shown across the platform.</div><input id="platform_name" placeholder="Local Shop Platform"></div>
<div class="setting"><label class="setting-title" for="support_email">Support Email</label><div class="setting-desc">Email used for platform support.</div><input id="support_email" type="email" placeholder="support@example.com"></div>
<div class="setting"><label class="setting-title" for="support_phone">Support Phone</label><div class="setting-desc">Main support contact number.</div><input id="support_phone" type="tel" placeholder="+91 XXXXX XXXXX"></div>
<div class="setting"><label class="setting-title" for="maintenance_mode">Maintenance Mode</label><div class="setting-desc">Turn this ON only when the platform is under maintenance.</div><select id="maintenance_mode"><option value="false">OFF</option><option value="true">ON</option></select></div>
<button class="primary" onclick="saveSettings()">Save Settings</button></div>
<div class="card"><h2>Current Platform</h2><div class="row"><div><b>Project</b><p>Local Shop Platform</p></div><div><b>Database</b><p>Supabase</p></div></div></div>
</div>
<script>
const defaultSettings={platform_name:"Local Shop Platform",support_email:"",support_phone:"",maintenance_mode:"false"};
function showError(msg){const box=document.getElementById("errorBox");box.textContent=msg;box.style.display="block";document.getElementById("successBox").style.display="none"}
function showSuccess(msg){const box=document.getElementById("successBox");box.textContent=msg;box.style.display="block";document.getElementById("errorBox").style.display="none"}
async function checkMaster(){const {data:{session}}=await supabaseClient.auth.getSession();if(!session){location.href="login.html";return false}const {data,error}=await supabaseClient.from("owners").select("role").eq("id",session.user.id).maybeSingle();if(error||!data||data.role!=="master"){await supabaseClient.auth.signOut();location.href="login.html";return false}return true}
async function loadSettings(){const {data,error}=await supabaseClient.from("platform_settings").select("setting_key,setting_value");if(error){showError(error.message);return}const settings={...defaultSettings};(data||[]).forEach(row=>{settings[row.setting_key]=row.setting_value??""});document.getElementById("platform_name").value=settings.platform_name;document.getElementById("support_email").value=settings.support_email;document.getElementById("support_phone").value=settings.support_phone;document.getElementById("maintenance_mode").value=settings.maintenance_mode==="true"?"true":"false"}
async function saveOne(key,value){const {data:existing}=await supabaseClient.from("platform_settings").select("id").eq("setting_key",key).maybeSingle();if(existing){const {error}=await supabaseClient.from("platform_settings").update({setting_value:value,updated_at:new Date().toISOString()}).eq("setting_key",key);if(error)throw error}else{const {error}=await supabaseClient.from("platform_settings").insert({setting_key:key,setting_value:value});if(error)throw error}}
async function saveSettings(){try{await saveOne("platform_name",document.getElementById("platform_name").value.trim());await saveOne("support_email",document.getElementById("support_email").value.trim());await saveOne("support_phone",document.getElementById("support_phone").value.trim());await saveOne("maintenance_mode",document.getElementById("maintenance_mode").value);showSuccess("Settings saved successfully.")}catch(error){showError(error.message)}}
(async()=>{if(await checkMaster()){await loadSettings()}})();
</script>
<script src="master-shell.js"></script>
</body>
