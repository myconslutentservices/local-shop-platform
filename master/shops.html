  <style>

      }

  </style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <h1>Pro Master Panel</h1>
    <p>Shop Management</p>
  </div>

  <button class="logout-btn" id="logoutBtn">
    Logout
  </button>
</header>

<main class="container">

  <div class="top-bar">
    <div>
      <h2>All Shops</h2>
      <p>Manage all shops from one place.</p>
    </div>

    <button class="add-btn" id="openAddShopBtn">
      + Add Shop
    </button>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search shop by name or slug..."
    />
  </div>

  <div class="shops-grid" id="shopsGrid">
    <div class="loading">
      Loading shops...
    </div>
  </div>

</main>


<!-- ADD / EDIT SHOP MODAL -->

<div class="modal-overlay" id="shopModal">

  <div class="modal">

    <div class="modal-header">
      <h2 id="modalTitle">Add New Shop</h2>

      <button class="close-btn" id="closeShopModal" type="button">
        ×
      </button>
    </div>

    <div class="form-message" id="formMessage"></div>

    <form id="shopForm">

      <div class="form-group">
        <label>Shop Name *</label>
        <input
          type="text"
          id="shopName"
          placeholder="Example: Kailash Fashion"
          required
        />
      </div>

      <div class="form-group">
        <label>Shop Slug *</label>
        <input
          type="text"
          id="shopSlug"
          placeholder="kailash-fashion"
          required
        />
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input
          type="tel"
          id="shopPhone"
          placeholder="9876543210"
        />
      </div>

      <div class="form-group">
        <label>WhatsApp</label>
        <input
          type="tel"
          id="shopWhatsapp"
          placeholder="9876543210"
        />
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea
          id="shopAddress"
          placeholder="Shop address..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          id="shopDescription"
          placeholder="Short description..."
        ></textarea>
      </div>

      <div class="form-group">
        <label>Status</label>

        <select id="shopStatus">
          <option value="active">Active</option>
          <option value="maintenance">Maintenance</option>
          <option value="suspended">Suspended</option>
        </select>
      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="cancel-btn"
          id="cancelShopBtn"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="save-btn"
          id="saveShopBtn"
        >
          Save Shop
        </button>

      </div>

    </form>

  </div>

</div>


<!-- VIEW SHOP MODAL -->

<div class="modal-overlay" id="viewModal">

  <div class="modal">

    <div class="modal-header">
      <h2>Shop Details</h2>

      <button class="close-btn" id="closeViewModal">
        ×
      </button>
    </div>

    <div class="details-grid" id="shopDetails"></div>

    <div class="modal-actions">

      <button
        class="cancel-btn"
        id="closeViewBtn"
      >
        Close
      </button>

    </div>

  </div>

</div>


<script>

  let allShops = [];
  let editingShopId = null;


  const shopsGrid = document.getElementById("shopsGrid");
  const searchInput = document.getElementById("searchInput");
  const errorBox = document.getElementById("errorBox");

  const shopModal = document.getElementById("shopModal");
  const viewModal = document.getElementById("viewModal");

  const shopForm = document.getElementById("shopForm");
  const formMessage = document.getElementById("formMessage");

  const modalTitle = document.getElementById("modalTitle");

  const shopName = document.getElementById("shopName");
  const shopSlug = document.getElementById("shopSlug");
  const shopPhone = document.getElementById("shopPhone");
  const shopWhatsapp = document.getElementById("shopWhatsapp");
  const shopAddress = document.getElementById("shopAddress");
  const shopDescription = document.getElementById("shopDescription");
  const shopStatus = document.getElementById("shopStatus");

  const saveShopBtn = document.getElementById("saveShopBtn");


  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showError(message) {

    errorBox.textContent = message;
    errorBox.style.display = "block";
  }


  function hideError() {

    errorBox.textContent = "";
    errorBox.style.display = "none";
  }


  function showFormMessage(message, type) {

    formMessage.textContent = message;
    formMessage.className =
      "form-message " + type;
  }


  function clearFormMessage() {

    formMessage.textContent = "";
    formMessage.className = "form-message";
  }


  async function verifyMaster() {

    const {
      data: sessionData,
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    const session = sessionData.session;

    if (!session) {

      window.location.href = "./login.html";
      return false;
    }

    const {
      data: master,
      error
    } = await supabaseClient
      .from("owners")
      .select("full_name, role, shop_id")
      .eq("id", session.user.id)
      .single();

    if (error || !master || master.role !== "master") {

      await supabaseClient.auth.signOut();

      window.location.href = "./login.html";

      return false;
    }

    return true;
  }


  async function loadShops() {

    hideError();

    shopsGrid.innerHTML = `
      <div class="loading">
        Loading shops...
      </div>
    `;

    const {
      data,
      error
    } = await supabaseClient
      .from("shops")
      .select(`
        id,
        name,
        slug,
        phone,
        whatsapp,
        address,
        description,
        status,
        created_at
      `)
      .order("created_at", {
        ascending: false
      });

    if (error) {

      console.error(error);

      showError(
        "Failed to load shops: " + error.message
      );

      shopsGrid.innerHTML = `
        <div class="empty">
          Unable to load shops.
        </div>
      `;

      return;
    }

    allShops = data || [];

    renderShops(allShops);
  }


  function getStatusClass(status) {

    if (status === "maintenance") {
      return "status-maintenance";
    }

    if (status === "suspended") {
      return "status-suspended";
    }

    return "status-active";
  }


  function renderShops(shops) {

    if (!shops.length) {

      shopsGrid.innerHTML = `
        <div class="empty">
          No shops found.
        </div>
      `;

      return;
    }

    shopsGrid.innerHTML = shops.map(shop => {

      const status =
        shop.status || "active";

      return `
        <div class="shop-card">

          <h3>
            ${escapeHtml(shop.name)}
          </h3>

          <div class="shop-slug">
            /${escapeHtml(shop.slug)}
          </div>

          ${
            shop.phone
              ? `
                <div class="shop-info">
                  <strong>Phone:</strong>
                  ${escapeHtml(shop.phone)}
                </div>
              `
              : ""
          }

          ${
            shop.whatsapp
              ? `
                <div class="shop-info">
                  <strong>WhatsApp:</strong>
                  ${escapeHtml(shop.whatsapp)}
                </div>
              `
              : ""
          }

          ${
            shop.address
              ? `
                <div class="shop-info">
                  <strong>Address:</strong>
                  ${escapeHtml(shop.address)}
                </div>
              `
              : ""
          }

          <div>
            <span class="status ${getStatusClass(status)}">
              ${escapeHtml(status)}
            </span>
          </div>

          <div class="shop-actions">

            <button
              class="action-btn view-btn"
              onclick="viewShop('${shop.id}')"
            >
              👁 View
            </button>

            <button
              class="action-btn edit-btn"
              onclick="editShop('${shop.id}')"
            >
              ✏ Edit
            </button>

            <button
              class="action-btn status-btn"
              onclick="changeShopStatus('${shop.id}')"
            >
              ⚙ Status
            </button>

            <button
              class="action-btn products-btn"
              onclick="openProducts('${shop.slug}')"
            >
              📦 Products
            </button>

            <button
              class="action-btn orders-btn"
              onclick="openOrders('${shop.id}')"
            >
              🛒 Orders
            </button>

            <button
              class="action-btn website-btn"
              onclick="openWebsite('${shop.slug}')"
            >
              🌐 Website
            </button>

            <button
              class="action-btn delete-btn"
              onclick="deleteShop('${shop.id}')"
            >
              🗑 Delete
            </button>

          </div>

        </div>
      `;

    }).join("");
  }


  searchInput.addEventListener("input", function() {

    const search =
      this.value.trim().toLowerCase();

    if (!search) {

      renderShops(allShops);
      return;
    }

    const filtered =
      allShops.filter(shop => {

        const name =
          (shop.name || "").toLowerCase();

        const slug =
          (shop.slug || "").toLowerCase();

        return (
          name.includes(search) ||
          slug.includes(search)
        );
      });

    renderShops(filtered);
  });


  function createSlug(value) {

    return value
      .toString()
      .trim()
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }


  shopName.addEventListener("input", function() {

    if (!shopSlug.dataset.manual) {

      shopSlug.value =
        createSlug(shopName.value);

    }
  });


  shopSlug.addEventListener("input", function() {

    shopSlug.dataset.manual = "true";

    shopSlug.value =
      createSlug(shopSlug.value);
  });


  function openAddShopModal() {

    editingShopId = null;

    modalTitle.textContent =
      "Add New Shop";

    saveShopBtn.textContent =
      "Save Shop";

    shopForm.reset();

    delete shopSlug.dataset.manual;

    shopStatus.value = "active";

    clearFormMessage();

    shopModal.classList.add("show");

    setTimeout(() => {
      shopName.focus();
    }, 100);
  }


  function openEditShopModal(shop) {

    editingShopId = shop.id;

    modalTitle.textContent =
      "Edit Shop";

    saveShopBtn.textContent =
      "Update Shop";

    clearFormMessage();

    shopName.value =
      shop.name || "";

    shopSlug.value =
      shop.slug || "";

    shopPhone.value =
      shop.phone || "";

    shopWhatsapp.value =
      shop.whatsapp || "";

    shopAddress.value =
      shop.address || "";

    shopDescription.value =
      shop.description || "";

    shopStatus.value =
      shop.status || "active";

    shopSlug.dataset.manual = "true";

    shopModal.classList.add("show");
  }


  function closeShopModal() {

    shopModal.classList.remove("show");

    shopForm.reset();

    clearFormMessage();

    editingShopId = null;

    delete shopSlug.dataset.manual;
  }


  document
    .getElementById("openAddShopBtn")
    .addEventListener(
      "click",
      openAddShopModal
    );


  document
    .getElementById("closeShopModal")
    .addEventListener(
      "click",
      closeShopModal
    );


  document
    .getElementById("cancelShopBtn")
    .addEventListener(
      "click",
      closeShopModal
    );


  shopModal.addEventListener("click", function(event) {

    if (event.target === shopModal) {
      closeShopModal();
    }
  });


  shopForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    clearFormMessage();

    const name =
      shopName.value.trim();

    const slug =
      createSlug(shopSlug.value);

    const phone =
      shopPhone.value.trim();

    const whatsapp =
      shopWhatsapp.value.trim();

    const address =
      shopAddress.value.trim();

    const description =
      shopDescription.value.trim();

    const status =
      shopStatus.value;


    if (!name) {

      showFormMessage(
        "Shop name is required.",
        "error"
      );

      return;
    }


    if (!slug) {

      showFormMessage(
        "Shop slug is required.",
        "error"
      );

      return;
    }


    if (!/^[a-z0-9-]+$/.test(slug)) {

      showFormMessage(
        "Slug can contain only lowercase letters, numbers and hyphens.",
        "error"
      );

      return;
    }


    saveShopBtn.disabled = true;

    saveShopBtn.textContent =
      editingShopId
        ? "Updating..."
        : "Saving...";


    try {

      let query =
        supabaseClient
          .from("shops")
          .select("id")
          .eq("slug", slug);

      if (editingShopId) {
        query = query.neq("id", editingShopId);
      }

      const {
        data: existingShop,
        error: checkError
      } = await query.maybeSingle();

      if (checkError) {
        throw checkError;
      }

      if (existingShop) {

        showFormMessage(
          "This shop slug is already in use.",
          "error"
        );

        return;
      }


      const shopData = {
        name,
        slug,
        phone: phone || null,
        whatsapp: whatsapp || null,
        address: address || null,
        description: description || null,
        status
      };


      if (editingShopId) {

        const {
          error
        } = await supabaseClient
          .from("shops")
          .update(shopData)
          .eq("id", editingShopId);

        if (error) {
          throw error;
        }

        showFormMessage(
          "Shop updated successfully!",
          "success"
        );

      } else {

        const {
          error
        } = await supabaseClient
          .from("shops")
          .insert([shopData]);

        if (error) {

          if (error.code === "23505") {
            throw new Error(
              "This shop slug is already in use."
            );
          }

          throw error;
        }

        showFormMessage(
          "Shop added successfully!",
          "success"
        );
      }


      await loadShops();


      setTimeout(() => {
        closeShopModal();
      }, 700);


    } catch (error) {

      console.error(
        "SHOP SAVE ERROR:",
        error
      );

      showFormMessage(
        error.message ||
        "Failed to save shop.",
        "error"
      );

    } finally {

      saveShopBtn.disabled = false;

      saveShopBtn.textContent =
        editingShopId
          ? "Update Shop"
          : "Save Shop";
    }

  });


  window.viewShop = function(id) {

    const shop =
      allShops.find(
        item => item.id === id
      );

    if (!shop) {
      return;
    }

    document.getElementById("shopDetails").innerHTML = `

      <div class="detail-box">
        <small>Shop Name</small>
        <strong>${escapeHtml(shop.name)}</strong>
      </div>

      <div class="detail-box">
        <small>Slug</small>

      <div class="detail-box">

        <strong>${escapeHtml(shop.phone || "Not added")}</strong>
      </div>

      <div class="detail-box">

        <strong>${escapeHtml(shop.whatsapp || "Not added")}</strong>
      </div>

      <div class="detail-box">
        <small>Status</small>
        <strong>${escapeHtml(shop.status || "active")}</strong>
      </div>

      <div class="detail-box">

          ${shop.created_at
            ? new Date(shop.created_at).toLocaleString()
            : "Not available"}

    `;

  window.editShop = function(id) {

    const shop =
      allShops.find(
        item => item.id === id
      );

    if (!shop) {
      return;
    }

    openEditShopModal(shop);
  };


  window.changeShopStatus = async function(id) {

    const shop =
      allShops.find(
        item => item.id === id
      );

    if (!shop) {
      return;
    }

    const newStatus =
      prompt(
        `Enter status for "${shop.name}":\n\nactive\nmaintenance\nsuspended`,
        shop.status || "active"
      );

    if (newStatus === null) {
      return;
    }

    const status =
      newStatus.trim().toLowerCase();

    if (
      ![
        "active",
        "maintenance",
        "suspended"
      ].includes(status)
    ) {

      alert(
        "Invalid status. Use: active, maintenance or suspended."
      );

      return;
    }


    const {
      error
    } = await supabaseClient
      .from("shops")
      .update({
        status
      })
      .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Failed to update status: " +
        error.message
      );

      return;
    }


    await loadShops();
  };


  window.deleteShop = async function(id) {

    const shop =
      allShops.find(
        item => item.id === id
      );

    if (!shop) {
      return;
    }


    const confirmed =
      confirm(
        `Delete "${shop.name}"?\n\nThis action may fail if this shop has related products, orders or other records.`
      );

    if (!confirmed) {
      return;
    }


    const {
      error
    } = await supabaseClient
      .from("shops")
      .delete()
      .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Shop could not be deleted.\n\n" +
        error.message
      );

      return;
    }


    await loadShops();

    alert("Shop deleted successfully.");
  };

    /*

      If all-products.html exists, open it.

    window.location.href =
      `all-products.html?shop=${encodeURIComponent(slug)}`;
  };

    */

    window.location.href =
      `all-orders.html?shop_id=${encodeURIComponent(shopId)}`;
  };


  window.openWebsite = function(slug) {

    const url =
      `../${encodeURIComponent(slug)}/`;

    window.open(
      url,
      "_blank"
    );
  };


  document
    .getElementById("closeViewModal")
    .addEventListener(

      () => viewModal.classList.remove("show")
    );


  document
    .getElementById("closeViewBtn")
    .addEventListener(

    );


  viewModal.addEventListener("click", function(event) {

    if (event.target === viewModal) {
      viewModal.classList.remove("show");
    }
  });


  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
          "./login.html";
      }
    );


  async function init() {

    try {

      const isMaster =
        await verifyMaster();

      if (!isMaster) {
        return;
      }

      await loadShops();

    } catch (error) {

      console.error(
        "INIT ERROR:",
        error
      );

      showError(
        error.message ||
        "Something went wrong."
      );
    }
  }


  init();

</script>
