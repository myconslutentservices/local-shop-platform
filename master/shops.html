<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Master Panel - Shops</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    html,body{width:100%;min-height:100%;overflow-x:hidden}
    body{background:#f5f7fb;color:#1f2937;min-height:100vh}
    button,input,textarea,select{font:inherit}
    button{touch-action:manipulation}
    .header{background:#111827;color:#fff;padding:18px 25px;display:flex;justify-content:space-between;align-items:center;gap:15px}
    .header-left{min-width:0}.header-left h1{font-size:22px;margin-bottom:4px}.header-left p{color:#9ca3af;font-size:13px}
    .logout-btn{background:#ef4444;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold;white-space:nowrap}.logout-btn:hover{background:#dc2626}
    .container{width:100%;max-width:1250px;margin:0 auto;padding:25px}
    .top-bar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}.top-bar h2{font-size:24px}.top-bar p{color:#6b7280;font-size:14px;margin-top:5px}
    .add-btn{background:#2563eb;color:#fff;border:none;padding:12px 18px;border-radius:9px;cursor:pointer;font-size:14px;font-weight:bold}.add-btn:hover{background:#1d4ed8}
    .search-box{margin-bottom:20px}.search-box input{width:100%;padding:13px 15px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;outline:none;background:#fff}.search-box input:focus{border-color:#2563eb}
    .shops-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    .shop-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.04);min-width:0}.shop-card h3{font-size:19px;margin-bottom:7px;color:#111827;overflow-wrap:anywhere}.shop-slug{color:#6b7280;font-size:13px;margin-bottom:15px;word-break:break-all}.shop-info{font-size:14px;margin-bottom:8px;color:#374151;line-height:1.5;overflow-wrap:anywhere}.shop-info strong{color:#111827}
    .status{display:inline-block;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin:6px 0 16px;text-transform:capitalize}.status-active{background:#dcfce7;color:#166534}.status-maintenance{background:#fef3c7;color:#92400e}.status-suspended{background:#fee2e2;color:#991b1b}
    .shop-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:5px}.action-btn{border:none;padding:10px 9px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:bold;min-width:0}.action-btn:hover{filter:brightness(.96)}.view-btn{background:#eff6ff;color:#1d4ed8}.edit-btn{background:#f3f4f6;color:#374151}.status-btn{background:#fef3c7;color:#92400e}.products-btn{background:#ecfdf5;color:#047857}.orders-btn{background:#f5f3ff;color:#6d28d9}.website-btn{background:#e0f2fe;color:#0369a1}.delete-btn{background:#fee2e2;color:#b91c1c}
    .empty,.loading{background:#fff;border-radius:12px;padding:40px;text-align:center;color:#6b7280;grid-column:1/-1}.error-box{background:#fee2e2;color:#991b1b;padding:15px;border-radius:9px;margin-bottom:20px;display:none;overflow-wrap:anywhere}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:999}.modal-overlay.show{display:flex}.modal{background:#fff;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;border-radius:14px;padding:25px;box-shadow:0 15px 50px rgba(0,0,0,.2)}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:15px}.modal-header h2{font-size:21px}.close-btn{border:none;background:#f3f4f6;width:35px;height:35px;min-width:35px;border-radius:50%;cursor:pointer;font-size:20px}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:13px;font-weight:bold;color:#374151;margin-bottom:7px}.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:8px;outline:none;font-size:14px;background:#fff}.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#2563eb}.form-group textarea{min-height:90px;resize:vertical}.form-message{display:none;padding:11px 13px;border-radius:8px;font-size:13px;margin-bottom:15px}.form-message.error{display:block;background:#fee2e2;color:#991b1b}.form-message.success{display:block;background:#dcfce7;color:#166534}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.cancel-btn,.save-btn{border:none;padding:11px 20px;border-radius:8px;cursor:pointer;font-weight:bold}.cancel-btn{background:#f3f4f6;color:#374151}.save-btn{background:#2563eb;color:#fff}.save-btn:disabled{opacity:.6;cursor:not-allowed}.owner-section{margin:22px 0 6px;padding:16px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px}.owner-section h3{font-size:16px;margin-bottom:5px;color:#111827}.owner-section p{font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.5}.password-wrap{position:relative}.password-wrap input{padding-right:45px}.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;color:#6b7280;font-size:12px;font-weight:bold}.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-box{background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px;padding:12px;min-width:0}.detail-box small{display:block;color:#6b7280;margin-bottom:5px}.detail-box strong{color:#111827;word-break:break-word}
    @media (min-width:1450px){.shops-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (max-width:1100px){.shops-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.container{padding:22px}}
    @media (max-width:700px){
      .header{padding:15px;align-items:flex-start}.header-left h1{font-size:19px}.header-left p{font-size:12px}.logout-btn{padding:9px 13px;font-size:12px}
      .container{padding:16px}.top-bar{align-items:stretch}.top-bar>div{width:100%}.top-bar h2{font-size:21px}.top-bar p{font-size:13px}.add-btn{width:100%;padding:12px}
      .shops-grid{grid-template-columns:1fr;gap:14px}.shop-card{padding:16px}.shop-card h3{font-size:18px}.shop-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.action-btn{min-height:40px;padding:9px 6px;font-size:11px}
      .search-box{margin-bottom:15px}.search-box input{padding:12px}.details-grid{grid-template-columns:1fr}.modal-overlay{padding:10px;align-items:flex-end}.modal{max-height:92vh;border-radius:16px 16px 0 0;padding:18px;width:100%}.modal-header{margin-bottom:18px}.modal-header h2{font-size:19px}.modal-actions{flex-direction:column-reverse}.modal-actions button{width:100%;min-height:44px}
    }
    @media (max-width:420px){.header{flex-wrap:wrap}.header-left{width:100%}.logout-btn{width:100%}.container{padding:12px}.shop-card{padding:14px}.shop-actions{grid-template-columns:1fr 1fr}.action-btn{font-size:10.5px}.empty,.loading{padding:30px 15px}.modal{padding:16px}}
    @media (max-width:340px){.shop-actions{grid-template-columns:1fr}.action-btn{font-size:12px}.top-bar h2{font-size:20px}}
    @media (hover:none){.action-btn:hover,.logout-btn:hover,.add-btn:hover{filter:none}}
  </style>
</head>
<body>
<header class="header"><div class="header-left"><h1>Pro Master Panel</h1><p>Shop Management</p></div><button class="logout-btn" id="logoutBtn">Logout</button></header>
<main class="container">
  <div class="top-bar"><div><h2>All Shops</h2><p>Manage all shops from one place.</p></div><button class="add-btn" id="openAddShopBtn">+ Add Shop</button></div>
  <div class="error-box" id="errorBox"></div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="Search shop by name or slug..." /></div>
  <div class="shops-grid" id="shopsGrid"><div class="loading">Loading shops...</div></div>
</main>
<div class="modal-overlay" id="shopModal"><div class="modal"><div class="modal-header"><h2 id="modalTitle">Add New Shop</h2><button class="close-btn" id="closeShopModal" type="button">×</button></div><div class="form-message" id="formMessage"></div><form id="shopForm">
  <div class="form-group"><label>Shop Name *</label><input type="text" id="shopName" placeholder="Example: Kailash Fashion" required /></div>
  <div class="form-group"><label>Shop Slug *</label><input type="text" id="shopSlug" placeholder="kailash-fashion" required /></div>
  <div class="form-group"><label>Phone</label><input type="tel" id="shopPhone" placeholder="9876543210" /></div>
  <div class="form-group"><label>WhatsApp</label><input type="tel" id="shopWhatsapp" placeholder="9876543210" /></div>
  <div class="form-group"><label>Address</label><textarea id="shopAddress" placeholder="Shop address..."></textarea></div>
  <div class="form-group"><label>Description</label><textarea id="shopDescription" placeholder="Short description..."></textarea></div>
  <div class="form-group"><label>Status *</label><select id="shopStatus" required><option value="active">Active</option><option value="maintenance">Maintenance</option><option value="suspended">Suspended</option></select></div>
  <div class="owner-section" id="ownerSection">
    <h3>Owner Account</h3>
    <p>New owner login will be created automatically. The password is sent only to Supabase Authentication and is never stored in the database.</p>
    <div class="form-group"><label>Owner Gmail / Email *</label><input type="email" id="ownerEmail" placeholder="owner@gmail.com" autocomplete="email" /></div>
    <div class="form-group"><label>Owner Password *</label><div class="password-wrap"><input type="password" id="ownerPassword" placeholder="Minimum 6 characters" minlength="6" autocomplete="new-password" /><button type="button" class="toggle-password" id="toggleOwnerPassword">Show</button></div></div>
  </div>
  <div class="modal-actions"><button type="button" class="cancel-btn" id="cancelShopBtn">Cancel</button><button type="submit" class="save-btn" id="saveShopBtn">Save Shop</button></div>
</form></div></div>
<div class="modal-overlay" id="viewModal"><div class="modal"><div class="modal-header"><h2>Shop Details</h2><button class="close-btn" id="closeViewModal" type="button">×</button></div><div class="details-grid" id="shopDetails"></div><div class="modal-actions"><button class="cancel-btn" id="closeViewBtn" type="button">Close</button></div></div></div>
<script>
let allShops=[];let editingShopId=null;
const shopsGrid=document.getElementById("shopsGrid"),searchInput=document.getElementById("searchInput"),errorBox=document.getElementById("errorBox"),shopModal=document.getElementById("shopModal"),viewModal=document.getElementById("viewModal"),shopForm=document.getElementById("shopForm"),formMessage=document.getElementById("formMessage"),modalTitle=document.getElementById("modalTitle"),shopName=document.getElementById("shopName"),shopSlug=document.getElementById("shopSlug"),shopPhone=document.getElementById("shopPhone"),shopWhatsapp=document.getElementById("shopWhatsapp"),shopAddress=document.getElementById("shopAddress"),shopDescription=document.getElementById("shopDescription"),shopStatus=document.getElementById("shopStatus"),ownerSection=document.getElementById("ownerSection"),ownerEmail=document.getElementById("ownerEmail"),ownerPassword=document.getElementById("ownerPassword"),toggleOwnerPassword=document.getElementById("toggleOwnerPassword"),saveShopBtn=document.getElementById("saveShopBtn");
function escapeHtml(value){if(value===null||value===undefined)return"";return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function showError(message){errorBox.textContent=message;errorBox.style.display="block"}function hideError(){errorBox.textContent="";errorBox.style.display="none"}function showFormMessage(message,type){formMessage.textContent=message;formMessage.className="form-message "+type}function clearFormMessage(){formMessage.textContent="";formMessage.className="form-message"}
async function verifyMaster(){const{data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;const session=sessionData.session;if(!session){window.location.href="./login.html";return false}const{data:master,error}=await supabaseClient.from("owners").select("full_name, role, shop_id").eq("id",session.user.id).single();if(error||!master||master.role!=="master"){await supabaseClient.auth.signOut();window.location.href="./login.html";return false}return true}
async function loadShops(){hideError();shopsGrid.innerHTML='<div class="loading">Loading shops...</div>';const{data,error}=await supabaseClient.from("shops").select(`id,name,slug,phone,whatsapp,address,description,status,created_at`).order("created_at",{ascending:false});if(error){console.error(error);showError("Failed to load shops: "+error.message);shopsGrid.innerHTML='<div class="empty">Unable to load shops.</div>';return}allShops=data||[];renderShops(allShops)}
function getStatusClass(status){if(status==="maintenance")return"status-maintenance";if(status==="suspended")return"status-suspended";return"status-active"}
function renderShops(shops){if(!shops.length){shopsGrid.innerHTML='<div class="empty">No shops found.</div>';return}shopsGrid.innerHTML=shops.map(shop=>{const status=shop.status||"active";return `<div class="shop-card"><h3>${escapeHtml(shop.name)}</h3><div class="shop-slug">/${escapeHtml(shop.slug)}</div>${shop.phone?`<div class="shop-info"><strong>Phone:</strong> ${escapeHtml(shop.phone)}</div>`:""}${shop.whatsapp?`<div class="shop-info"><strong>WhatsApp:</strong> ${escapeHtml(shop.whatsapp)}</div>`:""}${shop.address?`<div class="shop-info"><strong>Address:</strong> ${escapeHtml(shop.address)}</div>`:""}<div><span class="status ${getStatusClass(status)}">${escapeHtml(status)}</span></div><div class="shop-actions"><button class="action-btn view-btn" onclick="viewShop('${shop.id}')">👁 View</button><button class="action-btn edit-btn" onclick="editShop('${shop.id}')">✏ Edit</button><button class="action-btn status-btn" onclick="changeShopStatus('${shop.id}')">⚙ Status</button><button class="action-btn products-btn" onclick="openProducts('${escapeHtml(shop.slug)}')">📦 Products</button><button class="action-btn orders-btn" onclick="openOrders('${shop.id}')">🛒 Orders</button><button class="action-btn website-btn" onclick="openWebsite('${escapeHtml(shop.slug)}')">🌐 Website</button><button class="action-btn delete-btn" onclick="deleteShop('${shop.id}')">🗑 Delete</button></div></div>`}).join("")}
searchInput.addEventListener("input",function(){const search=this.value.trim().toLowerCase();if(!search){renderShops(allShops);return}renderShops(allShops.filter(shop=>(shop.name||"").toLowerCase().includes(search)||(shop.slug||"").toLowerCase().includes(search)))})
function createSlug(value){return value.toString().trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
shopName.addEventListener("input",function(){if(!shopSlug.dataset.manual)shopSlug.value=createSlug(shopName.value)});shopSlug.addEventListener("input",function(){shopSlug.dataset.manual="true";shopSlug.value=createSlug(shopSlug.value)})
function openAddShopModal(){editingShopId=null;modalTitle.textContent="Add New Shop";saveShopBtn.textContent="Save Shop";shopForm.reset();delete shopSlug.dataset.manual;shopStatus.value="active";ownerSection.style.display="block";ownerEmail.required=true;ownerPassword.required=true;clearFormMessage();shopModal.classList.add("show");setTimeout(()=>shopName.focus(),100)}
function openEditShopModal(shop){editingShopId=shop.id;modalTitle.textContent="Edit Shop";saveShopBtn.textContent="Update Shop";clearFormMessage();shopName.value=shop.name||"";shopSlug.value=shop.slug||"";shopPhone.value=shop.phone||"";shopWhatsapp.value=shop.whatsapp||"";shopAddress.value=shop.address||"";shopDescription.value=shop.description||"";shopStatus.value=shop.status||"active";ownerSection.style.display="none";ownerEmail.required=false;ownerPassword.required=false;ownerEmail.value="";ownerPassword.value="";shopSlug.dataset.manual="true";shopModal.classList.add("show")}
function closeShopModal(){shopModal.classList.remove("show");shopForm.reset();clearFormMessage();editingShopId=null;delete shopSlug.dataset.manual;ownerSection.style.display="block";ownerEmail.required=true;ownerPassword.required=true}
document.getElementById("openAddShopBtn").addEventListener("click",openAddShopModal);toggleOwnerPassword.addEventListener("click",()=>{const isPassword=ownerPassword.type==="password";ownerPassword.type=isPassword?"text":"password";toggleOwnerPassword.textContent=isPassword?"Hide":"Show"});document.getElementById("closeShopModal").addEventListener("click",closeShopModal);document.getElementById("cancelShopBtn").addEventListener("click",closeShopModal);shopModal.addEventListener("click",e=>{if(e.target===shopModal)closeShopModal()});
shopForm.addEventListener("submit",async function(event){
  event.preventDefault(); clearFormMessage();
  const name=shopName.value.trim(),slug=createSlug(shopSlug.value),phone=shopPhone.value.trim(),whatsapp=shopWhatsapp.value.trim(),address=shopAddress.value.trim(),description=shopDescription.value.trim(),status=shopStatus.value,email=ownerEmail.value.trim().toLowerCase(),password=ownerPassword.value;
  if(!name){showFormMessage("Shop name is required.","error");return}
  if(!slug){showFormMessage("Shop slug is required.","error");return}
  if(!/^[a-z0-9-]+$/.test(slug)){showFormMessage("Slug can contain only lowercase letters, numbers and hyphens.","error");return}
  if(!editingShopId){if(!email){showFormMessage("Owner email is required.","error");return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showFormMessage("Please enter a valid owner email.","error");return}if(!password){showFormMessage("Owner password is required.","error");return}if(password.length<6){showFormMessage("Owner password must be at least 6 characters.","error");return}}
  saveShopBtn.disabled=true; saveShopBtn.textContent=editingShopId?"Updating...":"Creating...";
  try{
    let query=supabaseClient.from("shops").select("id").eq("slug",slug); if(editingShopId)query=query.neq("id",editingShopId);
    const{data:existingShop,error:checkError}=await query.maybeSingle(); if(checkError)throw checkError; if(existingShop){showFormMessage("This shop slug is already in use.","error");return}
    const shopData={name,slug,phone:phone||null,whatsapp:whatsapp||null,address:address||null,description:description||null,status};
    if(editingShopId){const{error}=await supabaseClient.from("shops").update(shopData).eq("id",editingShopId);if(error)throw error;showFormMessage("Shop updated successfully!","success");await loadShops();setTimeout(closeShopModal,700);return}
    const{data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;const token=sessionData.session?.access_token;if(!token){window.location.href="./login.html";return}
    const response=await fetch(`${SUPABASE_URL}/functions/v1/create-shop-owner`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${token}`},body:JSON.stringify({shop:shopData,owner:{email,password,full_name:name,phone:phone||null}})});
    let result={};try{result=await response.json()}catch(_){ } if(!response.ok){showFormMessage(result?.error||"Failed to create shop and owner.","error");return}
    showFormMessage("Shop and Owner created successfully!","success");await loadShops();setTimeout(closeShopModal,900);
  }catch(error){console.error("SHOP SAVE ERROR:",error);showFormMessage(error.message||"Failed to save shop.","error")}finally{saveShopBtn.disabled=false;saveShopBtn.textContent=editingShopId?"Update Shop":"Save Shop"}
});
window.viewShop=function(id){const shop=allShops.find(item=>item.id===id);if(!shop)return;document.getElementById("shopDetails").innerHTML=`<div class="detail-box"><small>Shop Name</small><strong>${escapeHtml(shop.name)}</strong></div><div class="detail-box"><small>Slug</small><strong>/${escapeHtml(shop.slug)}</strong></div><div class="detail-box"><small>Phone</small><strong>${escapeHtml(shop.phone||"Not added")}</strong></div><div class="detail-box"><small>WhatsApp</small><strong>${escapeHtml(shop.whatsapp||"Not added")}</strong></div><div class="detail-box"><small>Status</small><strong>${escapeHtml(shop.status||"active")}</strong></div><div class="detail-box"><small>Created</small><strong>${shop.created_at?new Date(shop.created_at).toLocaleString():"Not available"}</strong></div><div class="detail-box" style="grid-column:1/-1;"><small>Address</small><strong>${escapeHtml(shop.address||"Not added")}</strong></div><div class="detail-box" style="grid-column:1/-1;"><small>Description</small><strong>${escapeHtml(shop.description||"Not added")}</strong></div>`;viewModal.classList.add("show")}
window.editShop=function(id){const shop=allShops.find(item=>item.id===id);if(shop)openEditShopModal(shop)};
window.changeShopStatus=async function(id){const shop=allShops.find(item=>item.id===id);if(!shop)return;const newStatus=prompt(`Enter status for "${shop.name}":\n\nactive\nmaintenance\nsuspended`,shop.status||"active");if(newStatus===null)return;const status=newStatus.trim().toLowerCase();if(!["active","maintenance","suspended"].includes(status)){alert("Invalid status. Use: active, maintenance or suspended.");return}const{error}=await supabaseClient.from("shops").update({status}).eq("id",id);if(error){console.error(error);alert("Failed to update status: "+error.message);return}await loadShops()};
window.deleteShop=async function(id){const shop=allShops.find(item=>item.id===id);if(!shop)return;const confirmed=confirm(`Delete "${shop.name}"?\n\nThis action may fail if this shop has related products, orders or other records.`);if(!confirmed)return;const{error}=await supabaseClient.from("shops").delete().eq("id",id);if(error){console.error(error);alert("Shop could not be deleted.\n\n"+error.message);return}await loadShops();alert("Shop deleted successfully.")};
window.openProducts=function(slug){window.location.href=`all-products.html?shop=${encodeURIComponent(slug)}`};window.openOrders=function(shopId){window.location.href=`all-orders.html?shop_id=${encodeURIComponent(shopId)}`};window.openWebsite=function(slug){window.open(`../${encodeURIComponent(slug)}/`,"_blank")};
document.getElementById("closeViewModal").addEventListener("click",()=>viewModal.classList.remove("show"));document.getElementById("closeViewBtn").addEventListener("click",()=>viewModal.classList.remove("show"));viewModal.addEventListener("click",e=>{if(e.target===viewModal)viewModal.classList.remove("show")});document.getElementById("logoutBtn").addEventListener("click",async function(){await supabaseClient.auth.signOut();window.location.href="./login.html"});
async function init(){try{const isMaster=await verifyMaster();if(!isMaster)return;await loadShops()}catch(error){console.error("INIT ERROR:",error);showError(error.message||"Something went wrong.")}}init();
</script>
</body>
</html>
